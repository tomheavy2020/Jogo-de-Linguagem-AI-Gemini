<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MATRIX PLAYER · GLASS RTX</title>
<style>
:root{
  --neon:#00ff9d; --cyan:#00e5ff; --gold:#ffc233; --red:#ff3b5c; --purple:#a06bff;
  --glass:rgba(255,255,255,0.055);
  --glass-strong:rgba(255,255,255,0.10);
  --stroke:rgba(255,255,255,0.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100dvw;overflow:hidden;position:fixed;user-select:none;
  color:#eafff5;font-family:'Segoe UI','SF Pro Display',system-ui,sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%,#06123a 0%,#020617 55%,#000 100%);}
.bg-lights{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen;animation:drift 14s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:radial-gradient(circle,#00ff9d,transparent 70%);top:-120px;left:-100px}
.b2{width:520px;height:520px;background:radial-gradient(circle,#00e5ff,transparent 70%);bottom:-160px;right:-120px;animation-delay:-4s}
.b3{width:340px;height:340px;background:radial-gradient(circle,#a06bff,transparent 70%);top:40%;left:60%;animation-delay:-8s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,-50px) scale(1.18)}}
.grid3d{position:absolute;left:-25%;right:-25%;bottom:-12%;height:55%;
  background-image:linear-gradient(rgba(0,229,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.18) 1px,transparent 1px);
  background-size:44px 44px;transform:perspective(600px) rotateX(72deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent);
  mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent);
  animation:gridmove 3.2s linear infinite}
@keyframes gridmove{from{background-position:0 0}to{background-position:0 44px}}
.scanline{position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px)}
.player-container{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;padding:12px;gap:10px}
.glass{position:relative;border-radius:18px;border:1px solid var(--stroke);
  background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.35);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,transparent 18%,transparent 80%,rgba(255,255,255,.06) 100%)}
.glass::after{content:"";position:absolute;top:0;left:-80%;width:60%;height:100%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.14),transparent);animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-80%}85%,100%{left:130%}}
.player-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;flex-shrink:0;gap:10px}
.title-row{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.player-title{font-size:14px;font-weight:800;letter-spacing:2px;white-space:nowrap;
  background:linear-gradient(90deg,var(--neon),var(--cyan),var(--purple),var(--neon));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:hueflow 6s linear infinite;
  filter:drop-shadow(0 0 10px rgba(0,255,157,.5))}
@keyframes hueflow{to{background-position:300% 0}}
.mode-btns{display:flex;gap:6px;flex-shrink:0}
.mode-btn{background:var(--glass);border:1px solid var(--stroke);color:var(--cyan);padding:6px 12px;border-radius:10px;
  cursor:pointer;font-size:10px;font-weight:800;letter-spacing:1.5px;transition:all .25s}
.mode-btn.active{background:linear-gradient(135deg,var(--gold),#ff8a00);color:#1a1200;border-color:transparent}
.player-close{background:var(--glass);border:1px solid rgba(255,59,92,.5);color:var(--red);padding:6px 13px;border-radius:10px;
  cursor:pointer;font-size:11px;font-weight:800;transition:all .25s}
.select-row{flex-shrink:0}
.select-btn{width:100%;padding:13px;background:var(--glass);border:1px dashed rgba(0,229,255,.5);color:var(--cyan);
  border-radius:14px;font-size:11px;font-weight:800;cursor:pointer;letter-spacing:2px}
.select-hint{font-size:9px;color:rgba(234,255,245,.35);text-align:center;margin-top:5px}
.display-wrap{perspective:900px;flex-shrink:0}
.display-area{border-radius:20px;padding:16px;transform-style:preserve-3d;transition:transform .18s ease-out;
  border:1px solid rgba(0,255,157,.35);
  background:linear-gradient(160deg,rgba(0,255,157,.08),rgba(0,229,255,.05) 60%,rgba(160,107,255,.07));
  backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 30px rgba(0,255,157,.12),inset 0 1px 0 rgba(255,255,255,.2)}
.spectrum{display:flex;gap:3px;height:64px;align-items:flex-end;margin-bottom:12px;transform:translateZ(28px)}
.spectrum-bar{flex:1;min-height:3px;border-radius:3px 3px 1px 1px;transition:height .08s;
  background:linear-gradient(180deg,var(--purple),var(--cyan) 45%,var(--neon));
  box-shadow:0 0 8px rgba(0,255,157,.55),0 0 18px rgba(0,229,255,.3)}
.track-name{text-align:center;font-size:15px;font-weight:800;color:#eafff5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateZ(38px)}
.track-artist{text-align:center;font-size:10px;color:rgba(234,255,245,.45);margin-top:4px;transform:translateZ(24px)}
.progress-block{flex-shrink:0;padding:0 2px}
.progress-bar{width:100%;height:9px;background:rgba(255,255,255,.08);border-radius:6px;cursor:pointer}
.progress-fill{height:100%;border-radius:6px;width:0%;transition:width .15s;position:relative;
  background:linear-gradient(90deg,var(--neon),var(--cyan));
  box-shadow:0 0 12px rgba(0,255,157,.7),0 0 26px rgba(0,229,255,.4)}
.progress-fill::after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--neon)}
.time-labels{display:flex;justify-content:space-between;font-size:10px;color:rgba(234,255,245,.4);margin-top:5px}
.volume-row{display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;
  background:rgba(255,255,255,.1);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,var(--neon) 60%);
  box-shadow:0 0 12px rgba(0,255,157,.8);cursor:pointer}
.volume-row input[type=range]{flex:1}
.controls-area{display:flex;justify-content:center;align-items:center;gap:14px;flex-shrink:0;padding:6px 8px}
.ctrl-btn,.icon-btn{border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:all .2s;
  color:var(--neon);background:var(--glass);border:1px solid var(--stroke)}
.ctrl-btn{width:52px;height:52px;font-size:19px}
.icon-btn{width:42px;height:42px;font-size:14px}
.ctrl-btn:hover,.icon-btn:hover{transform:translateY(-3px) scale(1.05)}
.ctrl-btn:active,.icon-btn:active{transform:translateY(0) scale(.96)}
.ctrl-btn:disabled{opacity:.3;pointer-events:none}
.ctrl-btn.play{width:68px;height:68px;font-size:26px;color:#02130a;border:none;
  background:linear-gradient(150deg,#7dffc9,var(--neon) 45%,#00c97b);
  box-shadow:0 0 26px rgba(0,255,157,.65),0 10px 28px rgba(0,255,157,.3);
  animation:playpulse 2.4s ease-in-out infinite}
@keyframes playpulse{0%,100%{box-shadow:0 0 22px rgba(0,255,157,.55)}50%{box-shadow:0 0 44px rgba(0,255,157,.95)}}
.icon-btn.active{color:#02130a;background:linear-gradient(150deg,#7dffc9,var(--neon));border-color:transparent}
.playlist{flex:1;overflow-y:auto;padding:6px}
.playlist::-webkit-scrollbar{width:5px}
.playlist::-webkit-scrollbar-thumb{background:rgba(0,255,157,.35);border-radius:3px}
.playlist-item{padding:12px 13px;cursor:pointer;display:flex;gap:10px;font-size:11px;align-items:center;
  border-radius:12px;margin-bottom:4px;transition:all .2s;border:1px solid transparent;color:rgba(234,255,245,.8)}
.playlist-item:hover{background:var(--glass-strong);transform:translateX(4px)}
.playlist-item.active{background:linear-gradient(90deg,rgba(0,255,157,.18),rgba(0,229,255,.08));
  border-left:3px solid var(--neon);color:#fff}
.pl-index{font-size:9px;color:rgba(0,255,157,.5);width:22px;font-weight:800}
.pl-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-dur{font-size:9px;color:rgba(234,255,245,.35)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;padding:20px;text-align:center}
.empty-state span{font-size:32px}
.empty-state p{font-size:11px;color:rgba(234,255,245,.4)}
.tuner{flex:1;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.tuner-freq{font-size:44px;font-weight:900;letter-spacing:4px;color:var(--gold);
  text-shadow:0 0 14px rgba(255,194,51,.8),0 0 40px rgba(255,194,51,.4)}
.tuner-band{font-size:11px;color:rgba(234,255,245,.5);letter-spacing:4px}
.tuner-slider{width:100%;accent-color:var(--gold)}
.tuner-scan{display:flex;gap:12px}
.tuner-scan button{background:var(--glass);border:1px solid rgba(255,194,51,.6);color:var(--gold);padding:10px 16px;
  border-radius:12px;font-size:11px;font-weight:800;cursor:pointer}
.tuner-warn{font-size:9px;color:rgba(255,194,51,.55);text-align:center;max-width:300px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bg-lights">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="grid3d"></div>
</div>
<div class="scanline"></div>
<div class="player-container">
    <div class="player-header glass">
        <div class="title-row">
            <span class="player-title">◈ MATRIX PLAYER</span>
            <div class="mode-btns">
                <button class="mode-btn active" id="fmBtn" onclick="setMode('fm')">FM</button>
                <button class="mode-btn" id="amBtn" onclick="setMode('am')">AM</button>
            </div>
        </div>
        <button class="player-close" onclick="window.location.href='/index.html'">✕</button>
    </div>
    <div class="select-row" id="selectRow">
        <button class="select-btn" onclick="document.getElementById('fileInput').click()">📁 SELECIONAR MÚSICAS</button>
        <div class="select-hint">Apenas .mp3 acima de 2MB serão adicionados</div>
        <input type="file" id="fileInput" accept="audio/mpeg,.mp3" multiple style="display:none">
    </div>
    <div id="playerView" style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">
        <div class="display-wrap">
            <div class="display-area" id="displayArea">
                <div class="spectrum" id="spectrum"></div>
                <div class="track-name" id="trackName">Nenhuma música</div>
                <div class="track-artist" id="trackArtist">Selecione arquivos para começar</div>
            </div>
        </div>
        <div class="progress-block">
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="time-labels"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
        </div>
        <div class="volume-row"><span id="volIcon">🔊</span><input type="range" id="volumeSlider" min="0" max="100" value="80"></div>
        <div class="controls-area">
            <button class="icon-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀</button>
            <button class="ctrl-btn" onclick="prevTrack()" id="prevBtn" disabled>⏮</button>
            <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()" disabled>▶</button>
            <button class="ctrl-btn" onclick="nextTrack()" id="nextBtn" disabled>⏭</button>
            <button class="icon-btn" id="repeatBtn" onclick="toggleRepeat()">🔁</button>
        </div>
        <div class="playlist glass" id="playlist"></div>
    </div>
    <div class="tuner glass hidden" id="tunerView">
        <div class="tuner-band" id="tunerBand">FM · RÁDIO</div>
        <div class="tuner-freq" id="tunerFreq">98.5</div>
        <input type="range" class="tuner-slider" id="tunerSlider" min="881" max="1079" value="985">
        <div class="tuner-scan">
            <button onclick="scanTuner(-1)">◀ BUSCAR</button>
            <button id="tunerPlayBtn" onclick="toggleTuner()">▶ SINTONIZAR</button>
            <button onclick="scanTuner(1)">BUSCAR ▶</button>
        </div>
        <div class="tuner-warn">⚠ Navegadores não têm acesso ao chip de rádio. Sintonia simulada (ruído sintetizado).</div>
    </div>
</div>
<script>
const $=id=>document.getElementById(id);
let tracks=[],currentTrack=-1,isPlaying=false,shuffleOn=false,repeatMode=0,mode='player';
const audioEl=new Audio();
let audioCtx=null,analyser=null,sourceNode=null,dataArray=null,spectrumRAF=null;
function ensureAudioGraph(){
    if(audioCtx)return;
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    sourceNode=audioCtx.createMediaElementSource(audioEl);
    analyser=audioCtx.createAnalyser();analyser.fftSize=128;
    dataArray=new Uint8Array(analyser.frequencyBinCount);
    sourceNode.connect(analyser);analyser.connect(audioCtx.destination);
}
function fmt(s){if(!isFinite(s)||isNaN(s))return'0:00';s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function renderSpectrumBars(){$('spectrum').innerHTML=Array.from({length:24},()=>'<div class="spectrum-bar" style="height:18%"></div>').join('');}
function renderPlaylist(){
    const el=$('playlist');
    if(tracks.length===0){el.innerHTML='<div class="empty-state"><span>🎧</span><p>Nenhuma música ainda.<br>Toque em "Selecionar Músicas".</p></div>';return;}
    el.innerHTML=tracks.map((t,i)=>`<div class="playlist-item${i===currentTrack?' active':''}" onclick="playTrack(${i})"><span class="pl-index">${String(i+1).padStart(2,'0')}</span><span class="pl-name">${t.name}</span><span class="pl-dur">${t.dur?fmt(t.dur):'--:--'}</span></div>`).join('');
}
function enableControls(){$('playBtn').disabled=false;$('prevBtn').disabled=false;$('nextBtn').disabled=false;}
$('fileInput').addEventListener('change',e=>{
    const files=Array.from(e.target.files||[]);
    const accepted=files.filter(f=>/\.mp3$/i.test(f.name)&&f.size>2*1024*1024);
    if(!accepted.length){$('trackArtist').textContent='Nenhum .mp3 válido (>2MB)';return;}
    accepted.forEach(f=>tracks.push({name:f.name.replace(/\.mp3$/i,''),artist:'Arquivo local',url:URL.createObjectURL(f),dur:null}));
    renderPlaylist();enableControls();
    if(currentTrack===-1)$('trackArtist').textContent=tracks.length+' faixa(s) na playlist';
    e.target.value='';
});
function playTrack(i){
    ensureAudioGraph();if(audioCtx.state==='suspended')audioCtx.resume();
    currentTrack=i;const t=tracks[i];audioEl.src=t.url;
    $('trackName').textContent=t.name;$('trackArtist').textContent=t.artist;
    $('totalTime').textContent=t.dur?fmt(t.dur):'0:00';
    audioEl.play().then(()=>{isPlaying=true;$('playBtn').textContent='⏸';startSpectrum();}).catch(()=>{isPlaying=false;$('playBtn').textContent='▶';});
    renderPlaylist();
}
function togglePlay(){
    if(!tracks.length)return;
    if(currentTrack===-1){playTrack(0);return;}
    ensureAudioGraph();if(audioCtx.state==='suspended')audioCtx.resume();
    if(isPlaying){audioEl.pause();isPlaying=false;$('playBtn').textContent='▶';}
    else{audioEl.play().then(()=>{isPlaying=true;$('playBtn').textContent='⏸';startSpectrum();});}
}
function nextTrack(){if(!tracks.length)return;playTrack((currentTrack+1)%tracks.length);}
function prevTrack(){if(!tracks.length)return;playTrack((currentTrack-1+tracks.length)%tracks.length);}
function toggleShuffle(){shuffleOn=!shuffleOn;$('shuffleBtn').classList.toggle('active',shuffleOn);}
function toggleRepeat(){repeatMode=(repeatMode+1)%3;$('repeatBtn').classList.toggle('active',repeatMode!==0);$('repeatBtn').textContent=repeatMode===2?'🔂':'🔁';}
audioEl.addEventListener('loadedmetadata',()=>{if(currentTrack>=0){tracks[currentTrack].dur=audioEl.duration;$('totalTime').textContent=fmt(audioEl.duration);renderPlaylist();}});
audioEl.addEventListener('timeupdate',()=>{if(currentTrack===-1||!audioEl.duration)return;const pct=(audioEl.currentTime/audioEl.duration)*100;$('progressFill').style.width=pct+'%';$('currentTime').textContent=fmt(audioEl.currentTime);});
audioEl.addEventListener('ended',()=>{
    if(repeatMode===2){audioEl.currentTime=0;audioEl.play();return;}
    if(shuffleOn){let r;do{r=Math.floor(Math.random()*tracks.length);}while(r===currentTrack&&tracks.length>1);playTrack(r);return;}
    if(currentTrack===tracks.length-1&&repeatMode===0){isPlaying=false;$('playBtn').textContent='▶';return;}
    nextTrack();
});
$('progressBar').addEventListener('click',e=>{
    if(currentTrack===-1||!audioEl.duration)return;
    const r=$('progressBar').getBoundingClientRect();
    const p=(e.clientX-r.left)/r.width;
    audioEl.currentTime=Math.max(0,Math.min(1,p))*audioEl.duration;
});
$('volumeSlider').addEventListener('input',e=>{const v=e.target.value;audioEl.volume=v/100;$('volIcon').textContent=v==0?'🔇':(v<50?'🔉':'🔊');});
audioEl.volume=0.8;
function startSpectrum(){
    if(spectrumRAF)cancelAnimationFrame(spectrumRAF);
    const bars=document.querySelectorAll('.spectrum-bar');
    function draw(){
        if(!isPlaying){spectrumRAF=null;return;}
        if(analyser){analyser.getByteFrequencyData(dataArray);const step=Math.max(1,Math.floor(dataArray.length/bars.length));bars.forEach((b,i)=>{const v=dataArray[i*step]||0;b.style.height=Math.max(4,(v/255)*100)+'%';});}
        spectrumRAF=requestAnimationFrame(draw);
    }
    draw();
}
let tunerCtx=null,noiseSource=null,noiseGain=null,tunerPlaying=false;
function setMode(m){
    mode=m;$('fmBtn').classList.toggle('active',m==='fm');$('amBtn').classList.toggle('active',m==='am');
    stopTuner();
    if(isPlaying){audioEl.pause();isPlaying=false;$('playBtn').textContent='▶';}
    $('tunerBand').textContent=(m==='fm'?'FM':'AM')+' · RÁDIO';
    if(m==='fm'){$('tunerSlider').min=881;$('tunerSlider').max=1079;$('tunerSlider').value=985;}
    else{$('tunerSlider').min=530;$('tunerSlider').max=1700;$('tunerSlider').value=1000;}
    updateTunerFreq();
    $('playerView').classList.add('hidden');$('tunerView').classList.remove('hidden');$('selectRow').classList.add('hidden');
}
function updateTunerFreq(){const v=Number($('tunerSlider').value);$('tunerFreq').textContent=mode==='fm'?(v/10).toFixed(1):v;}
$('tunerSlider').addEventListener('input',updateTunerFreq);
function scanTuner(dir){const el=$('tunerSlider');const step=mode==='fm'?2:10;let v=Number(el.value)+dir*step;v=Math.max(Number(el.min),Math.min(Number(el.max),v));el.value=v;updateTunerFreq();}
function ensureTunerGraph(){
    if(tunerCtx)return;tunerCtx=new(window.AudioContext||window.webkitAudioContext)();
    const bufferSize=2*tunerCtx.sampleRate;const noiseBuffer=tunerCtx.createBuffer(1,bufferSize,tunerCtx.sampleRate);
    const output=noiseBuffer.getChannelData(0);for(let i=0;i<bufferSize;i++)output[i]=Math.random()*2-1;
    noiseSource=tunerCtx.createBufferSource();noiseSource.buffer=noiseBuffer;noiseSource.loop=true;
    noiseGain=tunerCtx.createGain();noiseGain.gain.value=0.15;noiseSource.connect(noiseGain);noiseGain.connect(tunerCtx.destination);noiseSource.start(0);
}
function toggleTuner(){
    if(tunerPlaying){stopTuner();return;}
    ensureTunerGraph();if(tunerCtx.state==='suspended')tunerCtx.resume();
    tunerPlaying=true;$('tunerPlayBtn').textContent='⏸ PARAR';
}
function stopTuner(){tunerPlaying=false;$('tunerPlayBtn').textContent='▶ SINTONIZAR';if(noiseGain)noiseGain.gain.value=0;}
renderSpectrumBars();renderPlaylist();
</script>
<script src="/fullscreen-helper.js"></script>
</body>
</html>
