<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⬡ MATRIX - Perfil Cyberpunk 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --neon: #00ff41;
            --neon-glow: rgba(0, 255, 65, 0.4);
            --cyan: #00f0ff;
            --bg-dark: #020804;
            --panel-bg: rgba(2, 12, 6, 0.82);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            background: #000;
            color: var(--neon);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 12px 30px;
            position: relative;
        }

        /* === BACKGROUND MATRIX RAIN & 3D CANVAS === */
        #matrix-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.65;
            pointer-events: none;
        }

        #avatar-canvas {
            width: 100%;
            height: 260px;
            display: block;
            touch-action: none;
            cursor: grab;
            position: relative;
            z-index: 2;
        }

        #avatar-canvas:active { cursor: grabbing; }

        /* === SCANLINES & CRT EFFECT === */
        .crt-overlay {
            position: fixed;
            inset: 0;
            z-index: 99;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 3px, 6px 100%;
            opacity: 0.85;
        }

        /* === 3D HOLOGRAPHIC GRID AT BOTTOM === */
        .holo-grid {
            position: fixed;
            bottom: -50px;
            left: -50%;
            width: 200%;
            height: 40vh;
            background-image:
                linear-gradient(0deg, rgba(0, 255, 65, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(400px) rotateX(75deg);
            animation: gridMove 8s linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        /* === CONTAINER PRINCIPAL GLASSMORPHISM === */
        .container {
            max-width: 480px;
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 20px;
            padding: 20px 16px 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.15), inset 0 0 20px rgba(0, 255, 65, 0.05);
            position: relative;
            z-index: 10;
            margin-top: 10px;
        }

        /* HEADER & TYPEWRITER TITLE */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(0, 255, 65, 0.25);
        }

        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 900;
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon);
            letter-spacing: 2px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid var(--neon);
            animation: typing 3s steps(22) infinite alternate, blink .75s step-end infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { 50% { border-color: transparent } }

        .header .back {
            color: rgba(0, 255, 65, 0.6);
            text-decoration: none;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            padding: 5px 12px;
            border: 1px solid rgba(0, 255, 65, 0.25);
            border-radius: 14px;
            transition: all 0.3s ease;
            background: rgba(0, 255, 65, 0.05);
        }

        .header .back:hover {
            border-color: var(--neon);
            color: #fff;
            box-shadow: 0 0 15px var(--neon);
        }

        /* === AVATAR 3D CONTAINER === */
        .avatar-3d-wrapper {
            position: relative;
            width: 100%;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            border-radius: 16px;
            background: radial-gradient(circle, rgba(0,255,65,0.08) 0%, rgba(0,0,0,0.6) 70%);
            border: 1px solid rgba(0, 255, 65, 0.15);
            box-shadow: inset 0 0 30px rgba(0,255,65,0.1);
            overflow: hidden;
        }

        .avatar-info-overlay {
            position: absolute;
            bottom: 8px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--cyan);
            text-shadow: 0 0 8px var(--cyan);
            pointer-events: none;
        }

        .profile-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 15px var(--neon);
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 4px;
        }

        .profile-name:hover { color: var(--neon); }

        .profile-level {
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: rgba(0, 255, 65, 0.7);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        /* === PULSING XP BAR === */
        .xp-section { margin: 12px 0 16px; }

        .xp-bar {
            background: rgba(0, 255, 65, 0.08);
            border-radius: 12px;
            height: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 65, 0.3);
            position: relative;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1);
        }

        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon), var(--cyan));
            border-radius: 12px;
            width: 0%;
            transition: width 0.8s ease-out;
            box-shadow: 0 0 20px var(--neon);
            position: relative;
            animation: pulseBar 2s infinite ease-in-out;
        }

        @keyframes pulseBar {
            0%, 100% { opacity: 0.9; box-shadow: 0 0 15px var(--neon); }
            50% { opacity: 1; box-shadow: 0 0 25px var(--cyan); }
        }

        .xp-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Share Tech Mono', monospace;
            margin-top: 6px;
        }

        /* === STATS GRID === */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 14px 0;
        }

        .stat-card {
            background: rgba(0, 255, 65, 0.03);
            border: 1px solid rgba(0, 255, 65, 0.15);
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--neon);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            transform: translateY(-2px);
        }

        .stat-card .number {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon);
        }

        .stat-card .label {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* === BADGES SECTION === */
        .badge-section {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(0, 255, 65, 0.15);
        }

        .badge-section .title {
            font-size: 10px;
            color: rgba(0, 255, 65, 0.7);
            font-family: 'Orbitron', monospace;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge-item {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            position: relative;
            transition: all 0.3s ease;
        }

        .badge-item.unlocked {
            border-color: var(--neon);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }

        .badge-item.locked {
            opacity: 0.3;
            filter: grayscale(1);
        }

        .badge-item .tooltip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            border: 1px solid var(--neon);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 8px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            font-family: 'Share Tech Mono', monospace;
            color: #fff;
            z-index: 20;
        }

        .badge-item:hover .tooltip { opacity: 1; }

        /* ACTIONS BUTTONS */
        .action-btns {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-cyber {
            flex: 1;
            padding: 10px;
            background: rgba(0, 255, 65, 0.06);
            border: 1px solid var(--neon);
            border-radius: 8px;
            color: var(--neon);
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn-cyber:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 20px var(--neon);
        }
    </style>
</head>
<body>

<canvas id="matrix-bg"></canvas>
<div class="crt-overlay"></div>
<div class="holo-grid"></div>

<div class="container">
    <div class="header">
        <h1>MATRIX // PERFIL 3D</h1>
        <a href="/index.html" class="back">✕ SAIR</a>
    </div>

    <!-- 3D AVATAR WORKSPACE -->
    <div class="avatar-3d-wrapper">
        <canvas id="avatar-canvas"></canvas>
        <div class="avatar-info-overlay">
            <span>HOLOGRAM: ONLINE</span>
            <span>SYSTEM: v3.4</span>
        </div>
    </div>

    <div class="profile-name" id="userName" onclick="editName()" title="Clique para editar seu nome">Operador</div>
    <div class="profile-level" id="userLevel">NÍVEL 1 · RECRUTA</div>

    <!-- XP BAR -->
    <div class="xp-section">
        <div class="xp-bar">
            <div class="xp-bar-fill" id="xpBar"></div>
        </div>
        <div class="xp-info">
            <span id="xpText">0 XP</span>
            <span id="nextLevelText">PRÓXIMO: 100 XP</span>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="number" id="modulesCount">0</div>
            <div class="label">MÓDULOS</div>
        </div>
        <div class="stat-card">
            <div class="number" id="badgesCount">0</div>
            <div class="label">BADGES</div>
        </div>
        <div class="stat-card">
            <div class="number" id="rankPosition">#1</div>
            <div class="label">RANKING</div>
        </div>
    </div>

    <!-- BADGES -->
    <div class="badge-section">
        <div class="title">⬡ CONQUISTAS DESBLOQUEADAS</div>
        <div class="badges" id="badgesContainer"></div>
    </div>

    <!-- ACTIONS -->
    <div class="action-btns">
        <button class="btn-cyber" onclick="editName()">✏️ EDITAR NOME</button>
        <a href="/index.html" class="btn-cyber">🏠 HUB MATRIX</a>
    </div>
</div>

<script src="/game-points.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   1. MATRIX RAIN ANIMATED CANVAS BACKGROUND
   ════════════════════════════════════════════════════════════ */
const mCanvas = document.getElementById('matrix-bg');
const mCtx = mCanvas.getContext('2d');

function resizeMatrix() {
    mCanvas.width = window.innerWidth;
    mCanvas.height = window.innerHeight;
}
resizeMatrix();
window.addEventListener('resize', resizeMatrix);

const mChars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZMATRIXアカサタナハマヤラワ";
const drops = Array.from({ length: Math.floor(window.innerWidth / 16) }, () => Math.random() * -100);

function drawMatrixRain() {
    mCtx.fillStyle = 'rgba(0, 0, 0, 0.08)';
    mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
    mCtx.fillStyle = '#00ff41';
    mCtx.font = '14px monospace';

    for (let i = 0; i < drops.length; i++) {
        const char = mChars[Math.floor(Math.random() * mChars.length)];
        const x = i * 16;
        const y = drops[i] * 16;

        mCtx.fillText(char, x, y);
        if (y > mCanvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}
setInterval(drawMatrixRain, 40);

/* ════════════════════════════════════════════════════════════
   2. THREE.JS 3D WIREFRAME HUMANOID AVATAR & HALO
   ════════════════════════════════════════════════════════════ */
const canvas3D = document.getElementById('avatar-canvas');
const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, canvas3D.clientWidth / canvas3D.clientHeight, 0.1, 100);
camera.position.set(0, 0, 5.5);

// Avatar Group
const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

// Materials
const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff41, wireframe: true, transparent: true, opacity: 0.85 });
const cyanWireMaterial = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.6 });

// Humanoid Wireframe Structure
// Head
const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.48, 2), wireMaterial);
head.position.y = 1.1;
avatarGroup.add(head);

// Visor
const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.4), cyanWireMaterial);
visor.position.set(0, 1.12, 0.2);
avatarGroup.add(visor);

// Neck & Chest/Torso
const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.35, 1.1, 8), wireMaterial);
torso.position.y = 0.2;
avatarGroup.add(torso);

// Shoulders
const shoulderL = new THREE.Mesh(new THREE.OctahedronGeometry(0.2, 1), wireMaterial);
shoulderL.position.set(-0.68, 0.65, 0);
avatarGroup.add(shoulderL);

const shoulderR = new THREE.Mesh(new THREE.OctahedronGeometry(0.2, 1), wireMaterial);
shoulderR.position.set(0.68, 0.65, 0);
avatarGroup.add(shoulderR);

// Arms
const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.7, 6), wireMaterial);
armL.position.set(-0.75, 0.2, 0);
avatarGroup.add(armL);

const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.7, 6), wireMaterial);
armR.position.set(0.75, 0.2, 0);
avatarGroup.add(armR);

// Energy Halo Ring (Spinning Particles)
const particleCount = 120;
const haloGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
    const angle = (i / particleCount) * Math.PI * 2;
    const r = 1.25 + (Math.random() * 0.1);
    positions[i * 3] = Math.cos(angle) * r;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 0.2;
    positions[i * 3 + 2] = Math.sin(angle) * r;
}
haloGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const haloMat = new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.04, transparent: true, opacity: 0.9 });
const halo = new THREE.Points(haloGeo, haloMat);
halo.position.y = 0.4;
avatarGroup.add(halo);

// Mouse / Touch Interaction Tracking
let targetRotX = 0, targetRotY = 0;

function updatePointer(x, y) {
    const rect = canvas3D.getBoundingClientRect();
    const px = (x - rect.left) / rect.width - 0.5;
    const py = (y - rect.top) / rect.height - 0.5;
    targetRotY = px * 0.8;
    targetRotX = py * 0.4;
}

window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

function resize3D() {
    const width = canvas3D.clientWidth;
    const height = canvas3D.clientHeight;
    if (canvas3D.width !== width || canvas3D.height !== height) {
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
    }
}

function animate3D(time) {
    requestAnimationFrame(animate3D);
    resize3D();

    const t = time * 0.0015;

    // Smooth floating
    avatarGroup.position.y = Math.sin(t * 1.5) * 0.12 - 0.3;

    // Continuous slow rotation + smooth pointer tracking
    avatarGroup.rotation.y += 0.008 + (targetRotY - avatarGroup.rotation.y) * 0.05;
    avatarGroup.rotation.x += (targetRotX - avatarGroup.rotation.x) * 0.05;

    // Halo animation
    halo.rotation.y -= 0.02;
    halo.rotation.z = Math.sin(t) * 0.15;

    renderer.render(scene, camera);
}
requestAnimationFrame(animate3D);

/* ════════════════════════════════════════════════════════════
   3. USER DATA SYNC & EDITING
   ════════════════════════════════════════════════════════════ */
function editName() {
    const current = localStorage.getItem('matrix_user_name') || 'Operador';
    const name = prompt('Digite seu novo nome de Operador Cyberpunk:', current);
    if (name && name.trim()) {
        const clean = name.trim();
        localStorage.setItem('matrix_user_name', clean);
        document.getElementById('userName').innerText = clean;
    }
}

function loadUserData() {
    const savedName = localStorage.getItem('matrix_user_name') || 'Operador';
    document.getElementById('userName').innerText = savedName;

    let xp = 0;
    let level = 1;

    if (window.MatrixPoints && typeof MatrixPoints.getXP === 'function') {
        xp = MatrixPoints.getXP();
        level = MatrixPoints.getLevel ? MatrixPoints.getLevel() : Math.floor(xp / 100) + 1;
    } else {
        xp = parseInt(localStorage.getItem('matrix_xp') || '0', 10);
        level = parseInt(localStorage.getItem('matrix_level') || '1', 10);
    }

    const nextLvlXp = level * 100;
    const currentLvlBaseXp = (level - 1) * 100;
    const progressInLvl = Math.max(0, xp - currentLvlBaseXp);
    const pct = Math.min(100, Math.floor((progressInLvl / 100) * 100));

    const titles = ['RECRUTA', 'CYBER-HACKER', 'NETRUNNER', 'MATRIX MASTER', 'ARQUITETO DADOS'];
    const title = titles[Math.min(level - 1, titles.length - 1)];

    document.getElementById('userLevel').innerText = `NÍVEL ${level} · ${title}`;
    document.getElementById('xpBar').style.width = pct + '%';
    document.getElementById('xpText').innerText = `${xp} XP`;
    document.getElementById('nextLevelText').innerText = `PRÓXIMO: ${nextLvlXp} XP`;

    const accessedModules = JSON.parse(localStorage.getItem('matrix_accessed_modules') || '[]');
    document.getElementById('modulesCount').innerText = accessedModules.length;

    renderBadges(level, accessedModules.length);
}

function renderBadges(level, moduleCount) {
    const allBadges = [
        { icon: '🚀', name: 'Iniciante', unlocked: true, desc: 'Acessou o Terminal Matrix' },
        { icon: '♟️', name: 'Mestre do Xadrez', unlocked: level >= 2, desc: 'Alcançou Nível 2' },
        { icon: '💻', name: 'Netrunner', unlocked: moduleCount >= 3, desc: 'Explorou 3+ Módulos' },
        { icon: '👑', name: 'Matrix Master', unlocked: level >= 5, desc: 'Alcançou Nível 5' }
    ];

    const container = document.getElementById('badgesContainer');
    container.innerHTML = '';
    let unlockedCount = 0;

    allBadges.forEach(b => {
        if (b.unlocked) unlockedCount++;
        const item = document.createElement('div');
        item.className = `badge-item ${b.unlocked ? 'unlocked' : 'locked'}`;
        item.innerHTML = `${b.unlocked ? b.icon : '🔒'}<div class="tooltip">${b.name}: ${b.desc}</div>`;
        container.appendChild(item);
    });

    document.getElementById('badgesCount').innerText = unlockedCount;
}

window.addEventListener('DOMContentLoaded', loadUserData);
</script>
</body>
</html>
