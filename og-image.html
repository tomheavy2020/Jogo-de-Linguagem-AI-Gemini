<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OG Image - Matrix OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#030504;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(0,255,65,.08),transparent 60%),radial-gradient(circle at 70% 60%,rgba(0,234,255,.06),transparent 50%),#030504}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(0,255,65,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.03) 1px,transparent 1px);background-size:40px 40px}
.content{position:relative;text-align:center;padding:40px;z-index:2}
.logo{font-size:42px;font-weight:900;color:#00ff41;text-shadow:0 0 40px rgba(0,255,65,.3),0 0 80px rgba(0,255,65,.1);letter-spacing:4px}
.sub{font-size:20px;color:rgba(255,255,255,.5);margin-top:8px;font-family:'Rajdhani',sans-serif;letter-spacing:3px}
.line{width:100px;height:2px;background:linear-gradient(90deg,transparent,#00ff41,transparent);margin:14px auto}
.price{font-size:48px;font-weight:900;color:#ffb000;text-shadow:0 0 30px rgba(255,176,0,.25);font-family:'Orbitron',sans-serif;margin:6px 0}
.tag{display:inline-block;margin-top:10px;padding:6px 18px;border:1px solid rgba(0,255,65,.2);border-radius:30px;font-size:12px;color:#00ff41;font-family:'Share Tech Mono',monospace;letter-spacing:2px}
.tag2{display:inline-block;margin-top:6px;font-size:11px;color:rgba(255,255,255,.3);font-family:'Share Tech Mono',monospace;letter-spacing:1px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="content">
<div class="logo">⬡ MATRIX OS</div>
<div class="sub">MENTORIA 1:1 · APP PUBLICADO EM 30 DIAS</div>
<div class="line"></div>
<div class="price">R$ 497</div>
<div class="tag">4 ENCONTROS · GARANTIA DE 7 DIAS</div>
<div class="tag2">ELTON CEO DEV · NODE.JS & PYTHON</div>
</div>
</body>
</html>
