<div class="runner-stage">
  <canvas id="runner-canvas" width="360" height="640"></canvas>
  <div class="runner-hud">
    <span id="runner-score">SCORE: 0000</span>
    <span id="runner-lives">♥♥♥</span>
  </div>
  <div class="runner-controls">
    <button id="btn-left" class="runner-btn">◀</button>
    <button id="btn-jump" class="runner-btn runner-btn--jump">▲</button>
    <button id="btn-right" class="runner-btn">▶</button>
  </div>
  <div class="runner-overlay" id="runner-overlay" style="display:none;">
    <h2>GAME OVER</h2>
    <button id="btn-restart" class="runner-btn runner-btn--jump">REINICIAR</button>
  </div>
</div>

<script src="/fullscreen-helper.js"></script>
