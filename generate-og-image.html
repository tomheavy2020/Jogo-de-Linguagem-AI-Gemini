<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>OG Image Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030504;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:20px;font-family:Orbitron,sans-serif}
canvas{width:600px;height:315px;border:2px solid #00ff41;border-radius:10px}
button{background:#00ff41;color:#000;border:0;padding:12px 30px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
a{color:#00ff41;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<canvas id="ogCanvas" width="1200" height="630"></canvas>
<button onclick="generate()">🔄 GERAR</button>
<a href="#" id="downloadLink" download="og-image.png">📥 BAIXAR PNG</a>
<script>
function generate() {
    const canvas = document.getElementById('ogCanvas');
    const ctx = canvas.getContext('2d');

    // Fundo
    ctx.fillStyle = '#030504';
    ctx.fillRect(0, 0, 1200, 630);

    // Gradiente
    const grad = ctx.createRadialGradient(600, 300, 50, 600, 300, 600);
    grad.addColorStop(0, 'rgba(0,255,65,0.05)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1200, 630);

    // Grid
    ctx.strokeStyle = 'rgba(0,255,65,0.03)';
    ctx.lineWidth = 1;
    for(let i=0;i<1200;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,630);ctx.stroke()}
    for(let i=0;i<630;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(1200,i);ctx.stroke()}

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Título
    ctx.font = '700 56px Orbitron, sans-serif';
    ctx.shadowColor = 'rgba(0,255,65,0.3)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#00ff41';
    ctx.fillText('⬡ MATRIX OS', 600, 200);
    ctx.shadowBlur = 0;

    // Subtítulo
    ctx.font = '400 24px Rajdhani, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('MENTORIA 1:1 · APP PUBLICADO EM 30 DIAS', 600, 260);

    // Linha
    ctx.strokeStyle = 'rgba(0,255,65,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(450, 290);
    ctx.lineTo(750, 290);
    ctx.stroke();

    // Preço
    ctx.font = '900 64px Orbitron, sans-serif';
    ctx.shadowColor = 'rgba(255,176,0,0.2)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#ffb000';
    ctx.fillText('R$ 497', 600, 380);
    ctx.shadowBlur = 0;

    // Tags
    ctx.font = '400 13px Share Tech Mono, monospace';
    const tags = ['4 ENCONTROS 1:1', 'GARANTIA DE 7 DIAS', 'SUPORTE TELEGRAM'];
    tags.forEach((tag, i) => {
        const x = 600 - 160 + i * 160;
        ctx.fillStyle = 'rgba(0,255,65,0.06)';
        ctx.beginPath();
        ctx.roundRect(x-70, 450, 140, 34, 17);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,255,65,0.15)';
        ctx.beginPath();
        ctx.roundRect(x-70, 450, 140, 34, 17);
        ctx.stroke();
        ctx.fillStyle = 'rgba(0,255,65,0.7)';
        ctx.fillText(tag, x, 467);
    });

    // Rodapé
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.font = '400 12px Share Tech Mono, monospace';
    ctx.fillText('ELTON CEO DEV · NODE.JS & PYTHON', 600, 570);

    const link = document.getElementById('downloadLink');
    link.href = canvas.toDataURL('image/png');
}

CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2*r) r = w/2;
    if (h < 2*r) r = h/2;
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y);
    this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r);
    this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r);
    this.quadraticCurveTo(x, y, x+r, y);
    return this;
};

// Gerar automaticamente ao carregar
generate();
</script>
</body>
</html>
