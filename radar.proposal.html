<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MATRIX OS // CAPTAIN FLIGHT RADAR</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cockpit-dark: #03080c;
            --neon-green: #00ff55;
            --neon-cyan: #00f0ff;
            --neon-amber: #ffb700;
            --glass-bg: rgba(3, 15, 10, 0.85);
            --border-glow: rgba(0, 255, 85, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            color: var(--neon-green);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* === MAP FULLSCREEN === */
        #radarMap {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #010604;
        }

        /* Dark Aviation Tiles Overrides */
        .leaflet-container { background: #010604 !important; }
        .leaflet-popup-content-wrapper {
            background: rgba(2, 12, 8, 0.92) !important;
            border: 1px solid var(--neon-green) !important;
            color: #fff !important;
            border-radius: 12px !important;
            box-shadow: 0 0 20px rgba(0, 255, 85, 0.2) !important;
            backdrop-filter: blur(8px);
        }
        .leaflet-popup-tip { background: var(--neon-green) !important; }

        /* CRT SCANLINES & HUD OVERLAY */
        .hud-scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            opacity: 0.6;
        }

        /* COCKPIT TOP BAR */
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 100;
            background: var(--glass-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 10px 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 30px rgba(0, 255, 85, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .brand-title span { color: var(--neon-cyan); }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(0, 255, 85, 0.06);
            border: 1px solid rgba(0, 255, 85, 0.2);
            border-radius: 20px;
            padding: 4px 10px;
            width: 160px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            width: 100%;
        }

        .search-box input::placeholder { color: rgba(0, 255, 85, 0.4); }

        .close-btn {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover { background: #ff3333; color: #000; box-shadow: 0 0 15px #ff3333; }

        /* COCKPIT FLIGHT INSTRUMENTS (HUD OVERLAY LEFT) */
        .cockpit-hud {
            position: fixed;
            top: 76px;
            left: 12px;
            z-index: 100;
            background: var(--glass-bg);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 10px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .hud-metric {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px dashed rgba(0, 255, 85, 0.15);
            padding-bottom: 4px;
        }

        .hud-metric .val { color: var(--neon-cyan); font-weight: bold; }

        /* CAPTAIN FLIGHT INSPECTOR MODAL (BOTTOM SLIDE) */
        .flight-panel {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 100;
            background: var(--glass-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 14px 18px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 255, 85, 0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: translateY(120%);
            transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .flight-panel.active { transform: translateY(0); }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flight-callsign {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .aircraft-model {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--neon-amber);
            border: 1px solid var(--neon-amber);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .flight-route {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 255, 85, 0.04);
            border: 1px dashed rgba(0, 255, 85, 0.2);
            border-radius: 12px;
            padding: 8px 12px;
            font-family: 'Share Tech Mono', monospace;
        }

        .airport {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .airport .code { font-size: 16px; font-weight: bold; color: var(--neon-green); }
        .airport .city { font-size: 9px; color: rgba(255, 255, 255, 0.6); }

        .route-line {
            flex: 1;
            margin: 0 12px;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            position: relative;
        }

        .route-line::after {
            content: '✈';
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #fff;
        }

        .flight-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
        }

        .stat-box {
            background: rgba(0, 255, 85, 0.03);
            border: 1px solid rgba(0, 255, 85, 0.1);
            border-radius: 8px;
            padding: 6px 4px;
        }

        .stat-box .v { font-size: 12px; color: #fff; font-weight: bold; }
        .stat-box .l { font-size: 8px; color: rgba(255, 255, 255, 0.5); }

        /* STATUS BOTTOM FLOATING BAR */
        .bottom-status-bar {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            background: var(--glass-bg);
            border: 1px solid var(--border-glow);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .blink-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* AIRCRAFT MAP SVG ICON */
        .plane-marker {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }

        .plane-marker svg {
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 6px rgba(0, 255, 85, 0.8));
        }

        @media (max-width: 600px) {
            .cockpit-hud { display: none; }
            .top-bar { padding: 8px 12px; }
            .brand-title { font-size: 11px; }
            .search-box { width: 110px; }
            .flight-stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div id="radarMap"></div>
<div class="hud-scanlines"></div>

<!-- TOP COCKPIT NAVIGATION BAR -->
<div class="top-bar">
    <div class="brand-title">
        <span>✈</span> MATRIX RADAR CAPTAIN
    </div>
    <div class="search-box">
        <input type="text" id="searchFlight" placeholder="Buscar Voo (ex: GOL)..." onkeyup="filterFlights()">
    </div>
    <button class="close-btn" onclick="window.location.href='/index.html'">✕ SAIR</button>
</div>

<!-- COCKPIT HUD LEFT INSTRUMENTS PANEL -->
<div class="cockpit-hud">
    <div class="hud-metric"><span>RADAR RANGE:</span> <span class="val">450 NM</span></div>
    <div class="hud-metric"><span>MODE:</span> <span class="val">ADS-B LIVE</span></div>
    <div class="hud-metric"><span>TRAFFIC:</span> <span class="val" id="hudTrafficCount">0 ACFT</span></div>
    <div class="hud-metric"><span>FREQ:</span> <span class="val">121.50 MHz</span></div>
</div>

<!-- CAPTAIN FLIGHT INSPECTOR PANEL -->
<div class="flight-panel" id="flightPanel">
    <div class="panel-header">
        <div class="flight-callsign">
            <span>✈</span> <span id="pCallsign">GLO1234</span>
        </div>
        <div class="aircraft-model" id="pModel">BOEING 737-MAX8</div>
        <button class="close-btn" style="padding: 2px 8px;" onclick="closePanel()">✕</button>
    </div>

    <div class="flight-route">
        <div class="airport">
            <span class="code" id="pOrigin">GRU</span>
            <span class="city">SÃO PAULO</span>
        </div>
        <div class="route-line"></div>
        <div class="airport">
            <span class="code" id="pDest">GIG</span>
            <span class="city">RIO JANEIRO</span>
        </div>
    </div>

    <div class="flight-stats-grid">
        <div class="stat-box"><div class="v" id="pAlt">35,000 FT</div><div class="l">ALTITUDE</div></div>
        <div class="stat-box"><div class="v" id="pSpeed">460 KTS</div><div class="l">VELOCIDADE</div></div>
        <div class="stat-box"><div class="v" id="pHeading">045°</div><div class="l">PROA (PRO)</div></div>
        <div class="stat-box"><div class="v" id="pSquawk">7000</div><div class="l">SQUAWK</div></div>
    </div>
</div>

<!-- BOTTOM FLOATING STATUS BAR -->
<div class="bottom-status-bar" id="bottomStatus">
    <div class="blink-dot"></div>
    <span id="statusCounter">Aguardando telemetria de voos...</span>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   CAPTAIN FLIGHT RADAR — REALTIME TELEMETRY ENGINE
   ════════════════════════════════════════════════════════════ */

const map = L.map('radarMap', {
    center: [-15.7801, -47.9292], // Brasil Center
    zoom: 5,
    zoomControl: false
});

// CartoDB Dark Matter Aviation Base Map
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 18
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

let planeMarkers = {};
let flightTrajectories = {};
let currentSelectedIcao = null;
let rawFlightData = [];

/* Airplane SVG Icon Generator */
function createPlaneSvg(color, heading) {
    return `<div class="plane-marker" style="transform: rotate(${heading}deg);">
        <svg viewBox="0 0 24 24" fill="${color}" stroke="#000" stroke-width="0.8">
            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
    </div>`;
}

/* Realistic Synthetic Flight Generator (Fallback) */
const CITIES = [
    { code: 'GRU', name: 'SÃO PAULO', lat: -23.4356, lng: -46.4731 },
    { code: 'GIG', name: 'RIO JANEIRO', lat: -22.8089, lng: -43.2436 },
    { code: 'BSB', name: 'BRASÍLIA', lat: -15.8697, lng: -47.9208 },
    { code: 'SSA', name: 'SALVADOR', lat: -12.9086, lng: -38.3225 },
    { code: 'CNF', name: 'BELO HORIZONTE', lat: -19.6244, lng: -43.9719 },
    { code: 'POA', name: 'PORTO ALEGRE', lat: -29.9939, lng: -51.1711 },
    { code: 'REC', name: 'RECIFE', lat: -8.1264, lng: -34.9228 }
];

const MODELS = ['BOEING 737-800', 'AIRBUS A320neo', 'EMBRAER E195-E2', 'BOEING 787 DREAMLINER'];

function generateSimulatedFlights() {
    const flights = [];
    for (let i = 0; i < 16; i++) {
        const orig = CITIES[i % CITIES.length];
        const dest = CITIES[(i + 3) % CITIES.length];
        const progress = (Date.now() / 1000 + i * 300) % 3600 / 3600;

        const lat = orig.lat + (dest.lat - orig.lat) * progress;
        const lng = orig.lng + (dest.lng - orig.lng) * progress;
        const heading = Math.atan2(dest.lng - orig.lng, dest.lat - orig.lat) * (180 / Math.PI);

        flights.push([
            `SIM${100 + i}`,
            `AZU${1000 + i}`,
            'Brazil',
            Math.floor(Date.now()/1000),
            Math.floor(Date.now()/1000),
            lng,
            lat,
            10500 + (i * 500),
            false,
            230 + (i * 10),
            (heading + 360) % 360,
            0,
            null,
            10500,
            '7000',
            false,
            0,
            orig.code,
            dest.code,
            MODELS[i % MODELS.length]
        ]);
    }
    return flights;
}

/* Update Flights Telemetry on Map */
function renderFlightData(states) {
    rawFlightData = states;
    const activeIds = new Set();
    let count = 0;

    states.forEach(state => {
        const icao24 = state[0];
        const callsign = state[1]?.trim() || `FLT-${icao24.slice(-4)}`;
        const lng = state[5];
        const lat = state[6];
        const altitudeMs = state[7] || 9000;
        const velocityMs = state[9] || 220;
        const heading = state[10] || 0;
        const origin = state[17] || 'GRU';
        const dest = state[18] || 'BSB';
        const model = state[19] || MODELS[Math.floor(Math.random() * MODELS.length)];

        if (lat && lng) {
            activeIds.add(icao24);
            count++;
            const pos = [lat, lng];
            const altFt = Math.round(altitudeMs * 3.28084);
            const speedKts = Math.round(velocityMs * 1.94384);

            const planeIcon = L.divIcon({
                className: '',
                html: createPlaneSvg('#00ff55', heading),
                iconSize: [26, 26],
                iconAnchor: [13, 13]
            });

            if (planeMarkers[icao24]) {
                const marker = planeMarkers[icao24];
                marker.setLatLng(pos);
                marker.setIcon(planeIcon);

                // Append point to flight trajectory polyline
                if (flightTrajectories[icao24]) {
                    flightTrajectories[icao24].addLatLng(pos);
                }
            } else {
                const marker = L.marker(pos, { icon: planeIcon }).addTo(map);

                // Create flight trajectory route line
                const polyline = L.polyline([pos], {
                    color: '#00f0ff',
                    weight: 2,
                    dashArray: '4, 6',
                    opacity: 0.65
                }).addTo(map);

                flightTrajectories[icao24] = polyline;

                marker.on('click', () => {
                    selectFlight({ icao24, callsign, model, origin, dest, altFt, speedKts, heading, squawk: state[14] || '7000' });
                });

                planeMarkers[icao24] = marker;
            }
        }
    });

    // Cleanup inactive aircraft
    for (const id in planeMarkers) {
        if (!activeIds.has(id)) {
            map.removeLayer(planeMarkers[id]);
            if (flightTrajectories[id]) map.removeLayer(flightTrajectories[id]);
            delete planeMarkers[id];
            delete flightTrajectories[id];
        }
    }

    document.getElementById('statusCounter').innerText = `RADAR ATIVO: ${count} TRAFEGOS RASTREADOS`;
    document.getElementById('hudTrafficCount').innerText = `${count} ACFT`;
}

function selectFlight(f) {
    currentSelectedIcao = f.icao24;
    document.getElementById('pCallsign').innerText = f.callsign;
    document.getElementById('pModel').innerText = f.model;
    document.getElementById('pOrigin').innerText = f.origin;
    document.getElementById('pDest').innerText = f.dest;
    document.getElementById('pAlt').innerText = `${f.altFt.toLocaleString()} FT`;
    document.getElementById('pSpeed').innerText = `${f.speedKts} KTS`;
    document.getElementById('pHeading').innerText = `${Math.round(f.heading)}°`;
    document.getElementById('pSquawk').innerText = f.squawk;

    document.getElementById('flightPanel').classList.add('active');

    if (planeMarkers[f.icao24]) {
        map.panTo(planeMarkers[f.icao24].getLatLng(), { animate: true });
    }
}

function closePanel() {
    document.getElementById('flightPanel').classList.remove('active');
}

/* Flight Search Filter */
function filterFlights() {
    const query = document.getElementById('searchFlight').value.toUpperCase();
    if (!query) return;

    for (const id in planeMarkers) {
        const marker = planeMarkers[id];
        const match = id.toUpperCase().includes(query);
        marker.setOpacity(match ? 1 : 0.2);
    }
}

/* Live Telemetry Fetch Loop */
async function fetchFlightTelemetry() {
    try {
        const res = await fetch('/api/flights', { signal: AbortSignal.timeout(3500) });
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data.states && data.states.length > 0) {
            renderFlightData(data.states);
            return;
        }
    } catch (e) {
        // Fallback to Captain Flight Synthetic Radar Engine
        renderFlightData(generateSimulatedFlights());
    }
}

fetchFlightTelemetry();
setInterval(fetchFlightTelemetry, 3000);
</script>
</body>
</html>
