<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Horóscopo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; min-height: 100vh;}

        .header { width: 100%; max-width: 700px; display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #00ff00; padding-bottom: 10px; text-shadow: 0 0 10px #00ff00; }
        .header h1 { font-size: 18px; margin: 0; }
        .header button { background: transparent; border: 1px solid #ff0000; color: #ff0000; padding: 4px 10px; border-radius: 4px; font-family: inherit; cursor: pointer;}

        .zodiac-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 500px; }
        .zodiac-card { background: rgba(0,0,0,0.9); border: 1px solid #00ff00; border-radius: 12px; padding: 15px 5px; text-align: center; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 0 10px rgba(0,255,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .zodiac-card:hover { background: #00ff00; color: #000; transform: scale(1.05); box-shadow: 0 0 30px #00ff00; }
        .zodiac-card .icon { font-size: 32px; margin-bottom: 5px; }
        .zodiac-card .name { font-size: 12px; font-weight: bold; }

        /* 🔥 LAYOUT DO MODAL (Só texto e datas) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #050505;
            border: 2px solid #00ff00;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 0 60px rgba(0,255,0,0.4);
            text-align: center;
        }
        .modal-close {
            position: absolute; top: -15px; right: -15px;
            background: #000; border: 2px solid #ff0000; color: #ff0000;
            border-radius: 50%; width: 35px; height: 35px; font-size: 16px; cursor: pointer; font-family: inherit;
        }
        .modal-title { font-size: 22px; margin-bottom: 10px; border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        .modal-dates { font-size: 13px; color: #aaa; margin-bottom: 15px; display: flex; justify-content: center; gap: 15px; }
        .modal-dates span { color: #00ff00; font-weight: bold; }
        .modal-body { font-size: 14px; line-height: 1.6; color: #ddd; }
        .loading-text { color: #888; }
    </style>
</head>
<body>
    <div class="header">
        <h1>♈ MATRIX HORÓSCOPO</h1>
        <button onclick="window.location.href='/index.html'">✕ Fechar</button>
    </div>

    <div class="zodiac-grid" id="zodiacGrid"></div>

    <!-- 🔥 MODAL COM HORÓSCOPO E DATAS DO SIGNO -->
    <div class="modal" id="zodiacModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modalTitle">♈ Áries</div>

            <!-- 🔥 ÁREA DAS DATAS DE ANIVERSÁRIO -->
            <div class="modal-dates" id="modalDates">
                📅 <span id="startDate">21/03</span> — <span id="endDate">19/04</span>
            </div>

            <div class="modal-body" id="modalBody">Carregando os astros...</div>
        </div>
    </div>

    <script>
        // 🔥 BANCO DE DADOS MATRIX (FALLBACK)
        const matrixHoroscopeDB = {
            "aries": "Seu dia será marcado por uma energia incansável, Áries. O cosmos está alinhado para que você tome a iniciativa. Não hesite em começar aquele projeto novo. O amor estará em alta se você manter a comunicação clara. A sorte está ao seu lado.",
            "taurus": "Touro, hoje é um dia para desacelerar e apreciar as pequenas vitórias. O conforto do lar chama por você. Finanças pedem atenção, mas você tem controle total. Uma conversa inesperada pode trazer boas notícias.",
            "gemini": "Gêmeos, sua mente está mais rápida que o normal. Aproveite para aprender algo novo e compartilhar ideias. O universo quer que você se conecte com pessoas que somam. Um pequeno passeio pode clarear suas ideias.",
            "cancer": "Câncer, a lua ilumina suas emoções hoje. É hora de cuidar de quem você ama. Sua intuição estará extremamente aguçada. Confie no seu coração para tomar decisões importantes no trabalho.",
            "leo": "Leão, o sol brilha especialmente para você hoje. Seu carisma estará magnético. Prepare-se para receber reconhecimento. No amor, a chave é a generosidade. Não economize nos gestos de carinho.",
            "virgo": "Virgem, a organização será sua aliada. Você terá clareza mental para resolver pendências antigas. Cuide da sua saúde, pois o corpo reflete a mente. Um amigo pode pedir sua ajuda, ofereça seu conselho.",
            "libra": "Libra, a harmonia é sua palavra-chave hoje. Evite conflitos desnecessários e busque o equilíbrio. As parcerias estarão em foco, e a justiça pode sorrir para você. O amor pede delicadeza.",
            "scorpio": "Escorpião, você está no controle da situação. Sua determinação será admirada. Mergulhe fundo nos seus objetivos, mas não se esqueça de olhar para trás e valorizar quem te apoia. Transformações estão a caminho.",
            "sagittarius": "Sagitário, a liberdade é o que move seu coração hoje. Explore novos horizontes, seja em pensamento ou em viagem. A positividade vai te guiar. No amor, a espontaneidade será seu maior trunfo.",
            "capricorn": "Capricórnio, a disciplina é sua maior ferramenta. Siga seu plano, mesmo que pareça lento. O tempo está ao seu favor. O trabalho duro será recompensado, e a estabilidade emocional chegará em breve.",
            "aquarius": "Aquário, você está pensando no futuro. Novas ideias surgirão, e você se sentirá inspirado para inovar. Conecte-se com sua comunidade. O amor pode surgir de uma amizade inesperada.",
            "pisces": "Peixes, a sensibilidade é seu superpoder hoje. Use a intuição para guiar suas escolhas. A arte e a música podem te trazer paz. Cuide do seu coração, alguém especial está pensando em você."
        };

        // 🔥 DADOS DOS SIGNOS COM DATAS DE ANIVERSÁRIO
        const signs = [
            { name: "Áries", icon: "♈", sign: "aries", start: "21/03", end: "19/04" },
            { name: "Touro", icon: "♉", sign: "taurus", start: "20/04", end: "20/05" },
            { name: "Gêmeos", icon: "♊", sign: "gemini", start: "21/05", end: "20/06" },
            { name: "Câncer", icon: "♋", sign: "cancer", start: "21/06", end: "22/07" },
            { name: "Leão", icon: "♌", sign: "leo", start: "23/07", end: "22/08" },
            { name: "Virgem", icon: "♍", sign: "virgo", start: "23/08", end: "22/09" },
            { name: "Libra", icon: "♎", sign: "libra", start: "23/09", end: "22/10" },
            { name: "Escorpião", icon: "♏", sign: "scorpio", start: "23/10", end: "21/11" },
            { name: "Sagitário", icon: "♐", sign: "sagittarius", start: "22/11", end: "21/12" },
            { name: "Capricórnio", icon: "♑", sign: "capricorn", start: "22/12", end: "19/01" },
            { name: "Aquário", icon: "♒", sign: "aquarius", start: "20/01", end: "18/02" },
            { name: "Peixes", icon: "♓", sign: "pisces", start: "19/02", end: "20/03" }
        ];

        const grid = document.getElementById('zodiacGrid');
        const modal = document.getElementById('zodiacModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDates = document.getElementById('modalDates');
        const startDate = document.getElementById('startDate');
        const endDate = document.getElementById('endDate');
        const modalBody = document.getElementById('modalBody');

        // 🔥 CRIA OS CARDS
        signs.forEach(s => {
            const card = document.createElement('div');
            card.className = 'zodiac-card';
            card.innerHTML = `<div class="icon">${s.icon}</div><div class="name">${s.name}</div>`;
            card.onclick = () => openHoroscope(s.sign, s.icon, s.name, s.start, s.end);
            grid.appendChild(card);
        });

        // 🔥 ABRE O HORÓSCOPO
        async function openHoroscope(sign, icon, name, start, end) {
            modalTitle.innerHTML = `${icon} ${name}`;
            startDate.innerText = start;
            endDate.innerText = end;
            modalDates.style.display = 'flex';
            modalBody.innerHTML = '<div class="loading-text">🌀 Sincronizando com o cosmos...</div>';
            modal.style.display = 'flex';

            try {
                const response = await fetch(`https://aztro.sameerkumar.website/?sign=${sign}&day=today`, { method: 'POST' });
                const data = await response.json();

                let msg = `<b>${data.current_date}</b><br><br>`;
                msg += `${data.description}<br><br>`;
                msg += `🔮 <b>Compatibilidade:</b> ${data.compatibility}<br>`;
                msg += `💼 <b>Carreira:</b> ${data.career}<br>`;
                msg += `❤️ <b>Amor:</b> ${data.love}<br>`;
                msg += `💰 <b>Finanças:</b> ${data.money}`;
                modalBody.innerHTML = msg;
            } catch (error) {
                // 🔥 FALLBACK: Usa o banco de dados Matrix
                const fallbackText = matrixHoroscopeDB[sign] || "Os astros estão em silêncio hoje. Medite e tente novamente mais tarde.";
                modalBody.innerHTML = `
                    <div style="color:#ffaa00; margin-bottom:10px;">⚠️ MODO MATRIX OFFLINE</div>
                    <b>Oráculo Matrix:</b><br><br>
                    ${fallbackText}<br><br>
                    <div style="color:#888; font-size:11px; margin-top:15px;">Sincronização astral temporariamente indisponível.</div>
                `;
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }
    </script>
<script src="/fullscreen-helper.js"></script>
</body>
</html>
