<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MATRIX ARENA ULTRA - MULTIPLAYER</title>
    <style>
        :root {
            --neon: #00ff41;
            --neon-cyan: #00f0ff;
            --neon-red: #ff3b3b;
            --neon-gold: #ffb000;
            --bg: #000;
            --panel: rgba(0, 8, 0, 0.9);
            --border: rgba(0, 255, 65, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: radial-gradient(ellipse at 50% 50%, #0a0a0a 0%, #000 100%);
            color: var(--neon); font-family: 'Courier New', monospace;
            height: 100dvh; width: 100dvw; overflow: hidden;
            position: fixed; -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .arena-container {
            display: flex; flex-direction: column;
            height: 100dvh; width: 100dvw;
            max-width: 500px; margin: 0 auto;
            padding: 10px; gap: 8px;
        }
        .arena-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; border: 1px solid var(--border);
            border-radius: 12px; background: var(--panel);
            flex-shrink: 0;
        }
        .arena-title { font-size: 13px; font-weight: bold; color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); }
        .arena-close { background: transparent; border: 1px solid var(--neon-red); color: var(--neon-red); padding: 4px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 10px; }

        /* Lobby multiplayer */
        .lobby {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 15px;
        }
        .lobby h2 { font-size: 14px; color: var(--neon-cyan); letter-spacing: 2px; }
        .lobby-btns { display: flex; gap: 10px; }
        .lobby-btn {
            padding: 12px 24px; border-radius: 12px; cursor: pointer;
            font-family: inherit; font-size: 12px; font-weight: bold;
            border: 1px solid var(--neon); background: var(--panel);
            color: var(--neon); transition: all 0.2s;
        }
        .lobby-btn:active { transform: scale(0.94); background: rgba(0,255,65,0.15); }
        .room-code {
            font-size: 28px; font-weight: bold; letter-spacing: 5px;
            color: var(--neon-gold); text-shadow: 0 0 20px var(--neon-gold);
            display: none;
        }
        .room-input {
            background: rgba(0,0,0,0.8); border: 1px solid var(--neon);
            color: var(--neon); padding: 10px; border-radius: 10px;
            font-family: inherit; font-size: 16px; text-align: center;
            letter-spacing: 5px; width: 150px; display: none;
        }
        .arena-stage {
            flex: 1; border: 2px solid var(--border);
            border-radius: 14px; background: rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
            min-height: 200px; display: none;
        }
        #arenaCanvas { width: 100%; height: 100%; }
        .char-select {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 5px; flex-shrink: 0; display: none;
        }
        .char-btn {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px 4px;
            cursor: pointer; text-align: center; font-family: inherit;
        }
        .char-btn.selected { border-color: var(--neon); box-shadow: 0 0 15px rgba(0,255,65,0.4); }
        .char-icon { font-size: 22px; display: block; }
        .char-name { font-size: 8px; color: var(--neon-cyan); }
        .arena-scoreboard {
            display: flex; justify-content: space-around;
            padding: 8px; border: 1px solid var(--border);
            border-radius: 10px; background: var(--panel);
            flex-shrink: 0; display: none;
        }
        .player-score .name { font-size: 9px; color: var(--neon-cyan); }
        .player-score .points { font-size: 16px; font-weight: bold; color: var(--neon-gold); }
        .player-score .hp { font-size: 8px; color: var(--neon-red); }
        .arena-controls { display: flex; gap: 5px; flex-shrink: 0; display: none; }
        .arena-btn {
            flex: 1; padding: 10px; border-radius: 10px;
            background: var(--panel); border: 1px solid var(--border);
            color: var(--neon); cursor: pointer; font-family: inherit;
            font-size: 11px; font-weight: bold;
        }
        .arena-btn.attack {
            background: linear-gradient(160deg, #3a0a0a, var(--neon-red));
            color: #fff; font-size: 16px;
        }
        .arena-btn:active { transform: scale(0.94); }
    </style>
</head>
<body>
    <div class="arena-container">
        <div class="arena-header">
            <span class="arena-title">⚔️ ARENA MULTIPLAYER</span>
            <button class="arena-close" onclick="window.location.href='/index.html'">✕</button>
        </div>

        <!-- LOBBY -->
        <div class="lobby" id="lobby">
            <h2>👥 BATALHA ENTRE AMIGOS</h2>
            <div class="lobby-btns">
                <button class="lobby-btn" onclick="createRoom()">🎮 CRIAR SALA</button>
                <button class="lobby-btn" onclick="showJoinInput()">🔑 ENTRAR</button>
            </div>
            <div class="room-code" id="roomCodeDisplay"></div>
            <input class="room-input" id="roomInput" placeholder="CÓDIGO" maxlength="4" />
            <button class="lobby-btn" id="joinBtn" style="display:none;" onclick="joinRoom()">CONECTAR</button>
            <div id="lobbyStatus" style="font-size:10px;color:var(--neon-cyan);"></div>
        </div>

        <!-- ARENA -->
        <div class="arena-stage" id="stage">
            <canvas id="arenaCanvas"></canvas>
        </div>
        <div class="char-select" id="charSelect">
            <button class="char-btn selected" onclick="selectChar(this, 'ninja')"><span class="char-icon">🥷</span><span class="char-name">NINJA</span></button>
            <button class="char-btn" onclick="selectChar(this, 'tank')"><span class="char-icon">🛡️</span><span class="char-name">TANK</span></button>
            <button class="char-btn" onclick="selectChar(this, 'archer')"><span class="char-icon">🏹</span><span class="char-name">ARQUEIRO</span></button>
            <button class="char-btn" onclick="selectChar(this, 'hacker')"><span class="char-icon">⚡</span><span class="char-name">HACKER</span></button>
        </div>
        <div class="arena-scoreboard" id="scoreboard">
            <div class="player-score"><div class="name">VOCÊ</div><div class="hp" id="myHP">HP: 100</div></div>
            <div class="player-score"><div class="name">AMIGO</div><div class="hp" id="opponentHP">HP: 100</div></div>
        </div>
        <div class="arena-controls" id="controls">
            <button class="arena-btn attack" onclick="attack()">⚔️ ATACAR</button>
        </div>
    </div>

<script src="/game-points.js"></script>
<script>
// ================= ARENA MULTIPLAYER =================
let ws = null;
let selectedChar = 'ninja';
let myHP = 100;
let opponentHP = 100;
let roomId = null;

const charAttack = { ninja: 15, tank: 25, archer: 18, hacker: 20 };

function connectWebSocket() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${window.location.host}`);

    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);

            if(data.type === 'arena_created') {
                roomId = data.roomId;
                document.getElementById('roomCodeDisplay').textContent = roomId;
                document.getElementById('roomCodeDisplay').style.display = 'block';
                document.getElementById('lobbyStatus').textContent = '⏳ Aguardando amigo entrar...';
            }
            if(data.type === 'arena_opponent_joined') {
                startArena();
            }
            if(data.type === 'arena_joined') {
                startArena();
            }
            if(data.type === 'arena_attack') {
                myHP = Math.max(0, myHP - data.damage);
                document.getElementById('myHP').textContent = 'HP: ' + myHP;
                if(myHP <= 0) alert('💀 Você perdeu!');
            }
            if(data.type === 'arena_opponent_left') {
                alert('👋 Amigo saiu da sala');
                location.reload();
            }
        } catch(e) {}
    };
}
connectWebSocket();

function createRoom() {
    ws.send(JSON.stringify({ type: 'arena_create' }));
}

function showJoinInput() {
    document.getElementById('roomInput').style.display = 'block';
    document.getElementById('joinBtn').style.display = 'block';
}

function joinRoom() {
    const code = document.getElementById('roomInput').value.trim().toUpperCase();
    if(code.length === 4) {
        ws.send(JSON.stringify({ type: 'arena_join', roomId: code }));
    }
}

function startArena() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('stage').style.display = 'block';
    document.getElementById('charSelect').style.display = 'grid';
    document.getElementById('scoreboard').style.display = 'flex';
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('lobbyStatus').textContent = '⚔️ BATALHA INICIADA!';
}

function selectChar(btn, char) {
    selectedChar = char;
    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function attack() {
    const damage = charAttack[selectedChar] + Math.floor(Math.random() * 10);
    opponentHP = Math.max(0, opponentHP - damage);
    document.getElementById('opponentHP').textContent = 'HP: ' + opponentHP;

    ws.send(JSON.stringify({ type: 'arena_attack', damage }));

    if(opponentHP <= 0) {
        alert('🏆 VITÓRIA! Você venceu!');
    }
}

// Canvas da arena
const canvas = document.getElementById('arenaCanvas');
const ctx = canvas.getContext('2d');
function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
}
resize();
window.addEventListener('resize', resize);

function drawArena() {
    requestAnimationFrame(drawArena);
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Círculo central
    ctx.strokeStyle = 'rgba(0,255,65,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(w/2, h/2, Math.min(w,h)/3, 0, Math.PI*2);
    ctx.stroke();

    // Você (esquerda)
    ctx.fillStyle = '#00ff41';
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(charAttack[selectedChar] ? '🥷' : '🥷', w*0.25, h*0.5);

    // Amigo (direita)
    ctx.fillStyle = '#ff3b3b';
    ctx.fillText('👾', w*0.75, h*0.5);
}
drawArena();
</script>
<script src="/fullscreen-helper.js"></script>
</body>
</html>
