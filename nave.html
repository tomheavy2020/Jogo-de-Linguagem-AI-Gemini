<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Matrix OS - Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --neon: #00ff41;
            --neon-dim: #00b32d;
            --neon-cyan: #00f0ff;
            --neon-gold: #ffb000;
            --neon-red: #ff3b3b;
            --bg: #000;
            --panel: rgba(0, 8, 0, 0.93);
            --border: rgba(0, 255, 65, 0.25);
            --border-active: rgba(0, 255, 65, 0.6);
            --text: #00ff00;
            --text-dim: #888;
            --font-sm: 10px;
            --font-md: 12px;
            --font-lg: 14px;
            --font-xl: 16px;
            --gap: 5px;
            --padding: 6px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000; color: var(--text);
            font-family: 'Courier New', monospace;
            height: 100dvh; width: 100dvw; overflow: hidden;
            position: fixed; -webkit-tap-highlight-color: transparent;
        }

        /* ============ MATRIX RAIN WALLPAPER ============ */
        #matrix-rain {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.15;
        }

        /* ============ LAYOUT PRINCIPAL ============ */
        .matrix-os {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100dvw;
            padding: var(--gap);
            gap: var(--gap);
            background: transparent;
        }

        /* ============ SYSTEM MONITOR ============ */
        .panel-status {
            flex-shrink: 0;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 6px; padding: var(--padding);
            display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 4px;
        }
        .stat-box {
            border: 1px solid var(--border); border-radius: 4px; padding: 3px;
            background: rgba(0,0,0,0.6); text-align: center;
        }
        .stat-box .title { color: var(--text-dim); font-size: 7px; text-transform: uppercase; }
        .stat-box .value { color: var(--text); font-weight: bold; font-size: var(--font-md); }
        .stat-box canvas { width: 100%; height: 14px; margin-top: 2px; }
        .telemetry-ticker {
            grid-column: 1 / 5; border-top: 1px dashed var(--border);
            padding-top: 2px; display: flex; align-items: center;
            justify-content: center; gap: 8px; color: var(--neon-cyan); font-size: 8px;
        }

        /* ============ CRYPTO TERMINAL ============ */
        .panel-crypto, .panel-ai {
            position: relative;
            cursor: default;
            transition: box-shadow 0.3s;
        }
        .panel-crypto:hover, .panel-ai:hover {
            box-shadow: 0 0 25px rgba(0,255,65,0.25);
        }
        .drag-handle {
            cursor: move;
            user-select: none;
        }
        .resize-handle {
            position: absolute;
            bottom: 0; right: 0;
            width: 16px; height: 16px;
            cursor: nw-resize;
            background: linear-gradient(135deg, transparent 50%, var(--neon) 50%);
            border-radius: 0 0 5px 0;
            z-index: 10;
        }
        .panel-crypto {
            flex-shrink: 0;
            height: 22dvh;
            min-height: 120px;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 6px; padding: var(--padding);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .crypto-header {
            border-bottom: 1px solid var(--border); padding: 3px 5px;
            display: flex; justify-content: space-between; font-size: var(--font-sm);
            flex-shrink: 0;
        }
        .crypto-price { text-align: center; padding: 2px; font-size: var(--font-md); font-weight: bold; flex-shrink: 0; }
        .crypto-chart-area { flex: 1; position: relative; overflow: hidden; min-height: 0; }
        #cryptoChartCanvas { width: 100%; height: 100%; background: #0a0a0a; border-radius: 3px; }
        .crypto-input-area { display: flex; border-top: 1px solid var(--border); padding: 3px; flex-shrink: 0; }
        .crypto-input-area input { flex: 1; background: transparent; border: none; color: var(--text); outline: none; font-family: inherit; font-size: var(--font-sm); }

        /* ============ MATRIX AI CORE ============ */
        .panel-ai {

            background: var(--panel); border: 1px solid var(--border-active);
            border-radius: 6px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 12px rgba(0,255,65,0.08);
        }
        .window-controls {
            display: flex; gap: 3px; align-items: center;
        }
        .win-btn {
            width: 16px; height: 16px; border-radius: 3px;
            border: 1px solid var(--border); cursor: pointer;
            font-size: 7px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); color: var(--text);
            transition: all 0.15s; font-family: inherit;
        }
        .win-btn:hover { background: rgba(0,255,0,0.2); }
        .win-btn.min { color: var(--neon-gold); }
        .win-btn.max { color: var(--neon-cyan); }
        .win-btn.minimized .panel-body { display: none !important; }
        .panel-minimized .chat-messages,
        .panel-minimized .quick-commands,
        .panel-minimized .chat-input-area,
        .panel-minimized .crypto-chart-area,
        .panel-minimized .crypto-price,
        .panel-minimized .crypto-input-area { display: none !important; }
        .ai-header {
            border-bottom: 1px solid var(--border); padding: 4px 8px;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; background: rgba(0,255,0,0.03);
        }
        .ai-title { font-size: var(--font-md); font-weight: bold; letter-spacing: 0.5px; }
        .ai-title .sub { color: var(--text-dim); font-size: 7px; display: block; }
        .ai-status { font-size: var(--font-sm); color: var(--neon); display: flex; align-items: center; gap: 3px; }
        .ai-status .dot {
            width: 5px; height: 5px; border-radius: 50%; background: var(--neon);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* Quick Commands */
        .quick-commands {
            display: flex; gap: 3px; flex-wrap: wrap; padding: 4px 6px;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .qc-btn {
            background: rgba(0,255,0,0.05); border: 1px solid var(--border);
            color: var(--text); font-size: 8px; padding: 3px 7px;
            border-radius: 10px; cursor: pointer; font-family: inherit;
        }
        .qc-btn:active { background: rgba(0,255,0,0.2); }

        /* Chat Messages */
        .chat-messages {
    max-height: 25dvh;
            flex: 1; overflow-y: auto; display: flex; flex-direction: column;
            gap: 4px; padding: 6px; min-height: 0; user-select: text;
        }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 2px; }
        .message {
            max-width: 95%; padding: 5px 8px; border-radius: 5px; font-size: var(--font-sm);
            border: 1px solid var(--border); background: rgba(0,255,0,0.03);
            animation: fadeIn 0.2s ease; line-height: 1.4;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; } }
        .user-message { align-self: flex-end; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); color: #fff; }
        .bot-message { align-self: flex-start; }
        .bot-message.result-card { border-color: var(--neon-cyan); background: rgba(0,240,255,0.04); }
        .bot-message.insight { border-color: var(--neon-gold); background: rgba(255,176,0,0.04); }
        .bot-message.error { border-color: var(--neon-red); background: rgba(255,59,59,0.04); }

        /* Input Area */
        .chat-input-area {
            display: flex; gap: 4px; border-top: 1px solid var(--border);
            padding: 4px; flex-shrink: 0; background: rgba(0,0,0,0.5);
        }
        .chat-input-area input {
            flex: 1; background: transparent; border: none; color: var(--text);
            outline: none; font-family: inherit; font-size: var(--font-md); padding: 0 4px;
        }
        .chat-input-area button {
            background: transparent; border: 1px solid var(--neon); color: var(--neon);
            padding: 3px 12px; border-radius: 4px; cursor: pointer; font-size: var(--font-sm);
        }

        /* ============ DESKTOP (2 colunas) ============ */
        @media (min-width: 900px) {
            .matrix-os {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto 1fr;
                gap: var(--gap);
            }
            .panel-status { grid-column: 1 / 3; grid-row: 1 / 2; }
        .panel-crypto, .panel-ai {
            position: relative;
            cursor: default;
            transition: box-shadow 0.3s;
        }
        .panel-crypto:hover, .panel-ai:hover {
            box-shadow: 0 0 25px rgba(0,255,65,0.25);
        }
        .drag-handle {
            cursor: move;
            user-select: none;
        }
        .resize-handle {
            position: absolute;
            bottom: 0; right: 0;
            width: 16px; height: 16px;
            cursor: nw-resize;
            background: linear-gradient(135deg, transparent 50%, var(--neon) 50%);
            border-radius: 0 0 5px 0;
            z-index: 10;
        }
            .panel-crypto { grid-column: 1 / 2; grid-row: 2 / 3; height: auto; min-height: 200px; }
            .panel-ai {
    flex-shrink: 0;
    flex-shrink: 0;
    max-height: 40dvh; grid-column: 2 / 3; grid-row: 2 / 3; }
        }
    </style>
</head>
<body>
    <!-- MATRIX RAIN WALLPAPER -->
    <canvas id="matrix-rain"></canvas>

    <div class="matrix-os">
        <!-- SYSTEM MONITOR -->
        <div class="panel-status">
            <div class="stat-box"><div class="title">CPU</div><div class="value" id="cpuValue">N/A</div><canvas id="cpuCanvas"></canvas></div>
            <div class="stat-box"><div class="title">MEM</div><div class="value" id="memValue">N/A</div><canvas id="memCanvas"></canvas></div>
            <div class="stat-box"><div class="title">SWAP</div><div class="value" id="swapValue">N/A</div><canvas id="swapCanvas"></canvas></div>
            <div class="stat-box"><div class="title">REDE</div><div class="value" id="netValue">N/A</div><canvas id="netCanvas"></canvas></div>
            <div class="telemetry-ticker">
                <span id="locationText">📍 --</span>
                <span>|</span>
                <span id="tempText">🌡️ --°C</span>
            </div>
        </div>

        <!-- CRYPTO TERMINAL -->
        <div class="panel-crypto">
            <div class="crypto-header drag-handle" onmousedown="startDrag(event, this.closest('.panel-crypto'))" ontouchstart="startDrag(event, this.closest('.panel-crypto'))"><span style="display:flex;gap:3px;"><button class="win-btn min" onclick="togglePanel(this)" title="Minimizar">─</button><button class="win-btn max" onclick="toggleMax(this)" title="Maximizar">□</button></span>
                <span>₿ CRYPTO TERMINAL</span>
                <span id="cryptoPair" style="color:var(--neon-gold);">BTC/USD</span>
            </div>
            <div class="crypto-price" id="cryptoPriceLabel">Carregando...</div>
            <div class="crypto-chart-area"><canvas id="cryptoChartCanvas"></canvas></div>
            <div class="resize-handle" onmousedown="startResize(event, this)" ontouchstart="startResize(event, this)"></div><div class="crypto-input-area">
                <span>~$</span>
                <input type="text" id="cryptoInput" placeholder="help para moedas" autocomplete="off">
            </div>
        </div>

        <!-- MATRIX AI CORE -->
        <div class="panel-ai">
            <div class="ai-header drag-handle" onmousedown="startDrag(event, this.closest('.panel-ai'))" ontouchstart="startDrag(event, this.closest('.panel-ai'))"><span style="display:flex;gap:3px;"><button class="win-btn min" onclick="togglePanel(this)" title="Minimizar">─</button><button class="win-btn max" onclick="toggleMax(this)" title="Maximizar">□</button></span>
                <div class="ai-title">📡 MATRIX AI CORE<span class="sub">OSINT ENGINE</span></div>
                <div class="ai-status"><span class="dot"></span>ONLINE</div>
            </div>

            <div class="quick-commands">
                <button class="qc-btn" data-cmd="whois">WHOIS</button>
                <button class="qc-btn" data-cmd="dns">DNS</button>
                <button class="qc-btn" data-cmd="ssl">SSL</button>
                <button class="qc-btn" data-cmd="headers">HEADERS</button>
                <button class="qc-btn" data-cmd="ping">PING</button>
                <button class="qc-btn" data-cmd="robots">ROBOTS</button>
                <button class="qc-btn" data-cmd="sitemap">SITEMAP</button>
                <button class="qc-btn" data-cmd="scan">SCAN</button>
                <button class="qc-btn" data-cmd="ip">IP</button>
                <button class="qc-btn" data-cmd="analyze">ANALYZE</button>
            </div>

            <div class="chat-messages" id="chatBox"></div>

            <div class="resize-handle" onmousedown="startResize(event, this)" ontouchstart="startResize(event, this)"></div><div class="chat-input-area">
                <input type="text" id="userInput" placeholder="> Comando OSINT ou pergunta..." autocomplete="off">
                <button id="sendBtn">▶</button>
            </div>
        </div>
    </div>

<script>
// ================= MATRIX RAIN WALLPAPER =================
function initMatrixRain() {
    const canvas = document.getElementById('matrix-rain');
    const ctx = canvas.getContext('2d');
    const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF<>/{}[]=+*#$%&';
    let drops = [];
    let fontSize = 12;
    let lastFrame = 0;
    const fps = 15;
    const interval = 1000 / fps;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        fontSize = canvas.width < 500 ? 10 : 12;
        const columns = Math.floor(canvas.width / fontSize);
        drops = [];
        for(let i = 0; i < columns; i++) {
            drops.push(Math.random() * canvas.height / fontSize);
        }
    }
    resize();
    window.addEventListener('resize', resize);

    function draw(now) {
        requestAnimationFrame(draw);
        if(now - lastFrame < interval) return;
        lastFrame = now;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for(let i = 0; i < drops.length; i++) {
            const char = chars[Math.floor(Math.random() * chars.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;

            // Brilho variado
            const bright = Math.random();
            if(bright > 0.95) {
                ctx.fillStyle = '#ffffff';
            } else if(bright > 0.7) {
                ctx.fillStyle = '#00ff41';
            } else {
                ctx.fillStyle = '#00b32d';
            }

            ctx.font = fontSize + 'px monospace';
            ctx.fillText(char, x, y);

            if(y > canvas.height && Math.random() > 0.98) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    // Pausar quando a página estiver em background
    document.addEventListener('visibilitychange', () => {
        if(document.hidden) {
            lastFrame = Infinity; // pausa
        } else {
            lastFrame = 0; // resume
        }
    });

    requestAnimationFrame(draw);
}
initMatrixRain();

// ================= SYSTEM MONITOR =================
function initMonitor() {
    const points = 30;
    let data = { cpu: Array(points).fill(0), mem: Array(points).fill(0), swap: Array(points).fill(0), net: Array(points).fill(0) };
    const canvases = { cpu: document.getElementById('cpuCanvas'), mem: document.getElementById('memCanvas'), swap: document.getElementById('swapCanvas'), net: document.getElementById('netCanvas') };
    const values = { cpu: document.getElementById('cpuValue'), mem: document.getElementById('memValue'), swap: document.getElementById('swapValue'), net: document.getElementById('netValue') };

    function resize() {
        for(let k in canvases) {
            const r = canvases[k].parentElement.getBoundingClientRect();
            canvases[k].width = r.width - 4;
            canvases[k].height = 14;
        }
    }
    resize(); window.addEventListener('resize', resize);

    function draw(canvas, arr, color) {
        const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
        ctx.clearRect(0,0,w,h);
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1;
        arr.forEach((v,i) => { const x = i/arr.length*w, y = h - v/100*h; i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); });
        ctx.stroke();
    }

    setInterval(() => {
        const cpu = Math.random()*30+5, mem = Math.random()*20+30, swap = Math.random()*10+2, net = Math.random()*50+10;
        values.cpu.innerText = Math.round(cpu)+'%'; values.mem.innerText = Math.round(mem)+'%';
        values.swap.innerText = Math.round(swap)+'%'; values.net.innerText = '⬇'+Math.round(net)+'KB/s';
        data.cpu.push(cpu); data.cpu.shift(); data.mem.push(mem); data.mem.shift();
        data.swap.push(swap); data.swap.shift(); data.net.push(net); data.net.shift();
        draw(canvases.cpu, data.cpu, '#00ff00'); draw(canvases.mem, data.mem, '#00ff00');
        draw(canvases.swap, data.swap, '#ffaa00'); draw(canvases.net, data.net, '#00aaff');
    }, 1500);
}
initMonitor();

// ================= GPS =================
function initGPS() {
    const loc = document.getElementById('locationText'), temp = document.getElementById('tempText');
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&zoom=10`);
                const data = await res.json();
                loc.innerText = '📍 ' + (data.address?.city || data.address?.state || 'Localização').toUpperCase();
                temp.innerText = '🌡️ ' + (Math.floor(Math.random()*17)+18) + '°C';
            } catch(e) { loc.innerText = '📍 GPS OK'; }
        }, () => { loc.innerText = '📍 OFFLINE'; }, { timeout: 8000 });
    }
}
initGPS();

// ================= CRYPTO TERMINAL =================
const cryptoInput = document.getElementById('cryptoInput');
const cryptoChartCanvas = document.getElementById('cryptoChartCanvas');
const cryptoPriceLabel = document.getElementById('cryptoPriceLabel');
const cryptoPair = document.getElementById('cryptoPair');

const CRYPTO_BASE_PRICES = { btc:65000, eth:3200, sol:160, bnb:580, xrp:0.55, doge:0.12, ada:0.45, dot:6.5, link:14, matic:0.75, ltc:85, avax:35, uni:7.5, atom:8.2, etc:22 };
const CRYPTO_NAMES = { btc:'Bitcoin', eth:'Ethereum', sol:'Solana', bnb:'BNB', xrp:'XRP', doge:'Dogecoin', ada:'Cardano', dot:'Polkadot', link:'Chainlink', matic:'Polygon', ltc:'Litecoin', avax:'Avalanche', uni:'Uniswap', atom:'Cosmos', etc:'Ethereum Classic' };

let currentCrypto = 'btc', candles = [];

function generateCandles(basePrice, count = 40) {
    candles = []; let price = basePrice;
    for(let i = 0; i < count; i++) {
        const open = price, close = open + (Math.random()-0.5)*basePrice*0.04;
        candles.push({ open, close, high: Math.max(open,close)+Math.random()*basePrice*0.02, low: Math.min(open,close)-Math.random()*basePrice*0.02 });
        price = close;
    }
}

function drawCandlestick() {
    const canvas = cryptoChartCanvas;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width; canvas.height = rect.height;
    const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0,w,h);
    if(!candles.length) return;
    const allP = candles.flatMap(c=>[c.high,c.low]);
    const min = Math.min(...allP), max = Math.max(...allP), range = max-min || 1;
    const cw = w/candles.length*0.7, gap = w/candles.length*0.3;
    candles.forEach((c,i) => {
        const x = i*(w/candles.length)+gap/2;
        const oy = h-((c.open-min)/range)*h, cy = h-((c.close-min)/range)*h;
        const hy = h-((c.high-min)/range)*h, ly = h-((c.low-min)/range)*h;
        const green = c.close >= c.open;
        ctx.strokeStyle = green ? '#00ff00' : '#ff3b3b'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x+cw/2,hy); ctx.lineTo(x+cw/2,ly); ctx.stroke();
        ctx.fillStyle = green ? '#00ff00' : '#ff3b3b';
        ctx.fillRect(x, Math.min(oy,cy), cw, Math.max(Math.abs(cy-oy),1));
    });
}

function updateCrypto() {
    const base = CRYPTO_BASE_PRICES[currentCrypto] || 100;
    const name = CRYPTO_NAMES[currentCrypto] || currentCrypto.toUpperCase();
    cryptoPair.innerText = currentCrypto.toUpperCase() + '/USD';
    generateCandles(base); drawCandlestick();
    const last = candles[candles.length-1].close;
    const change = ((last-base)/base)*100;
    cryptoPriceLabel.innerHTML = `${name}: $${last.toFixed(2)} <span style="color:${change>=0?'#00ff00':'#ff3b3b'}">${change>=0?'▲':'▼'}${Math.abs(change).toFixed(1)}%</span>`;
}

cryptoInput.addEventListener('keypress', function(e) {
    if(e.key === 'Enter') {
        const cmd = this.value.trim().toLowerCase(); this.value = '';
        if(cmd === 'help') cryptoPriceLabel.innerHTML = '💰 ' + Object.keys(CRYPTO_BASE_PRICES).join(', ');
        else if(CRYPTO_BASE_PRICES[cmd]) { currentCrypto = cmd; updateCrypto(); }
        else cryptoPriceLabel.innerHTML = '❌ Moeda não encontrada';
    }
});

updateCrypto();
setInterval(() => {
    if(candles.length) {
        const base = CRYPTO_BASE_PRICES[currentCrypto];
        const last = candles[candles.length-1];
        candles.push({ open: last.close, close: last.close+(Math.random()-0.5)*base*0.03, high: last.close+Math.random()*base*0.02, low: last.close-Math.random()*base*0.02 });
        if(candles.length > 50) candles.shift();
        drawCandlestick();
    }
}, 5000);

// ================= MATRIX AI CORE =================
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
let commandHistory = [], historyIndex = -1;
let lastResult = null;

function addMessage(type, text, extraClass = '') {
    const div = document.createElement('div');
    div.className = 'message ' + type + '-message ' + extraClass;
    div.innerHTML = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

function helpText() {
    return `<b>╔══ MATRIX OSINT ══╗</b><br>
    whois [dom] • dns [dom] • ssl [dom]<br>
    headers [url] • scan [host] • ip [addr]<br>
    robots [dom] • sitemap [dom] • ping [host]<br>
    vazado [email]<br><br>
    <b>╔══ SYSTEM ═══╗</b><br>
    <b>analyze [dom]</b> - Análise completa<br>
    clear • help`;
}

// Quick Commands
document.querySelectorAll('.qc-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        userInput.value = btn.dataset.cmd + ' ';
        userInput.focus();
    });
});

// Command History
userInput.addEventListener('keydown', function(e) {
    if(e.key === 'ArrowUp') {
        e.preventDefault();
        if(historyIndex < commandHistory.length - 1) {
            historyIndex++;
            this.value = commandHistory[commandHistory.length - 1 - historyIndex];
        }
    } else if(e.key === 'ArrowDown') {
        e.preventDefault();
        if(historyIndex > 0) {
            historyIndex--;
            this.value = commandHistory[commandHistory.length - 1 - historyIndex];
        } else {
            historyIndex = -1;
            this.value = '';
        }
    }
});

// Analyze Command
async function analyzeTarget(target) {
    addMessage('bot', '[MATRIX CORE] Initializing...<br>[01] Resolving target........<br>[02] Querying DNS............<br>[03] Inspecting TLS..........<br>[04] Reading HTTP headers....<br>[05] Checking robots.txt.....<br>[06] Checking sitemap........<br>[07] Measuring latency.......', 'result-card');

    const results = {};
    let latency = 0;

    try {
        const start = Date.now();
        const dnsRes = await fetch(`https://dns.google/resolve?name=${target}&type=A`);
        latency = Date.now() - start;
        const dnsData = await dnsRes.json();
        results.dns = dnsData.Answer ? dnsData.Answer.map(a => a.data).join(', ') : null;
    } catch(e) { results.dns = null; }

    try {
        const whoisRes = await fetch(`https://rdap.org/domain/${target}`);
        if(whoisRes.ok) { const wd = await whoisRes.json(); results.whois = wd.entities?.[0]?.vcardArray?.[1]?.[1]?.[3] || 'Registrado'; }
        else results.whois = null;
    } catch(e) { results.whois = null; }

    try {
        const sslRes = await fetch(`https://${target}`, { mode: 'no-cors' });
        results.ssl = sslRes.type === 'opaque' || sslRes.ok ? 'Válido' : null;
    } catch(e) { results.ssl = null; }

    try {
        const hRes = await fetch(`https://${target}`, { method: 'HEAD', mode: 'no-cors' });
        results.headers = hRes.ok || hRes.type === 'opaque' ? 'Disponível' : null;
    } catch(e) { results.headers = null; }

    try {
        const rRes = await fetch(`https://${target}/robots.txt`);
        results.robots = rRes.ok ? 'Encontrado' : null;
    } catch(e) { results.robots = null; }

    try {
        const sRes = await fetch(`https://${target}/sitemap.xml`);
        results.sitemap = sRes.ok ? 'Encontrado' : null;
    } catch(e) { results.sitemap = null; }

    const statusColor = (val) => val ? '🟢' : '⚪';
    const card = `
        <b>╔══ MATRIX TARGET ═══╗</b><br>
        <b>TARGET:</b> ${target}<br>
        <b>STATUS:</b> ${latency > 0 ? 'ONLINE' : 'OFFLINE'}<br>
        <b>LATENCY:</b> ${latency}ms<br><br>
        DNS ${statusColor(results.dns)}<br>
        SSL ${statusColor(results.ssl)}<br>
        HTTP ${statusColor(results.headers)}<br>
        ROBOTS ${statusColor(results.robots)}<br>
        SITEMAP ${statusColor(results.sitemap)}<br>
        WHOIS ${statusColor(results.whois)}<br>
        <b>╚══════════════════════╝</b>
    `;

    const msg = addMessage('bot', card, 'result-card');
    lastResult = { target, results, latency };

    setTimeout(() => {
        const insights = [];
        if(results.dns) insights.push('✓ DNS resolvido com sucesso');
        if(results.ssl) insights.push('✓ HTTPS disponível');
        if(results.whois) insights.push('✓ WHOIS encontrado');
        if(latency < 100) insights.push('✓ Latência dentro do normal');
        if(!insights.length) insights.push('⚠️ Alvo com disponibilidade limitada');
        addMessage('bot', `<b>🤖 MATRIX AI INSIGHT</b><br>${insights.join('<br>')}`, 'insight');
    }, 500);
}

// Execute Command
async function executeCommand(cmd, args) {
    switch(cmd) {
        case 'help': addMessage('bot', helpText()); break;
        case 'clear': chatBox.innerHTML = ''; break;
        case 'analyze':
            if(!args) { addMessage('bot', '❌ Uso: analyze [domínio]', 'error'); return; }
            await analyzeTarget(args);
            break;
        case 'whois':
            if(!args) { addMessage('bot', '❌ Uso: whois [domínio]', 'error'); return; }
            try {
                const res = await fetch(`https://rdap.org/domain/${args}`);
                const data = await res.json();
                addMessage('bot', `<b>┌─ WHOIS ─┐</b><br>🏢 ${data.entities?.[0]?.vcardArray?.[1]?.[1]?.[3] || 'N/A'}<br>📅 ${data.events?.find(e=>e.eventAction==='registration')?.eventDate || 'N/A'}<br>🌐 ${data.nameservers?.map(ns=>ns.ldhName).join(', ') || 'N/A'}`, 'result-card');
            } catch(e) { addMessage('bot', `[ERROR] Could not resolve ${args}`, 'error'); }
            break;
        case 'dns':
            if(!args) { addMessage('bot', '❌ Uso: dns [domínio]', 'error'); return; }
            try {
                const res = await fetch(`https://dns.google/resolve?name=${args}&type=A`);
                const data = await res.json();
                addMessage('bot', data.Answer ? `<b>┌─ DNS ─┐</b><br>${data.Answer.map(a=>`${a.type}: ${a.data}`).join('<br>')}` : `[INFO] No records for ${args}`, 'result-card');
            } catch(e) { addMessage('bot', '[ERROR] DNS query failed', 'error'); }
            break;
        case 'ssl':
            if(!args) { addMessage('bot', '❌ Uso: ssl [domínio]', 'error'); return; }
            setTimeout(() => addMessage('bot', `<b>┌─ SSL ─┐</b><br>🔒 ${args} - SSL válido`, 'result-card'), 800);
            break;
        case 'headers':
            if(!args) { addMessage('bot', '❌ Uso: headers [url]', 'error'); return; }
            try {
                const res = await fetch(args.startsWith('http') ? args : 'https://'+args, { method:'HEAD', mode:'no-cors' });
                addMessage('bot', `<b>┌─ HEADERS ─┐</b><br>Status: ${res.status || 'N/A'}`, 'result-card');
            } catch(e) { addMessage('bot', '[ERROR] Could not fetch headers', 'error'); }
            break;
        case 'scan':
            if(!args) { addMessage('bot', '❌ Uso: scan [host]', 'error'); return; }
            addMessage('bot', `[SCAN] Scanning <b>${args}</b>...`);
            setTimeout(() => {
                const ports = [21,22,25,53,80,443,3306,8080];
                const open = ports.filter(()=>Math.random()>0.6);
                addMessage('bot', `<b>┌─ SCAN ─┐</b><br>Open ports: ${open.length ? open.join(', ') : 'none'}`, 'result-card');
            }, 1200);
            break;
        case 'ip':
            if(!args) { addMessage('bot', '❌ Uso: ip [endereço]', 'error'); return; }
            try {
                const res = await fetch(`https://ipapi.co/${args}/json/`);
                const data = await res.json();
                addMessage('bot', `<b>┌─ IP ─┐</b><br>🌍 ${data.country_name || 'N/A'}<br>🏙️ ${data.city || 'N/A'}<br>📡 ${data.org || 'N/A'}`, 'result-card');
            } catch(e) { addMessage('bot', '[ERROR] IP lookup failed', 'error'); }
            break;
        case 'ping':
            if(!args) { addMessage('bot', '❌ Uso: ping [host]', 'error'); return; }
            setTimeout(() => addMessage('bot', `📡 ${args} - ${Math.floor(Math.random()*50+5)}ms`), 800);
            break;
        case 'vazado':
            if(!args) { addMessage('bot', '❌ Uso: vazado [email]', 'error'); return; }
            setTimeout(() => addMessage('bot', Math.random()>0.5 ? `⚠️ ${args} em vazamentos` : `✅ ${args} não encontrado`), 1200);
            break;
        case 'ipinfo':
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                addMessage('bot', `✅ Seu IP: <b>${data.ip}</b>`);
            } catch(e) { addMessage('bot', '[ERROR] Could not get IP', 'error'); }
            break;
        default:
            addMessage('bot', `👾 <b>${cmd}</b>: não reconhecido. Digite 'help'`);
    }
}

// Send
sendBtn.addEventListener('click', () => {
    const text = userInput.value.trim();

    addMessage('user', '> ' + text);

    userInput.value = '';

// ================= DRAG & RESIZE =================
let dragTarget = null;
let dragOffsetX = 0, dragOffsetY = 0;
let resizeTarget = null;
let resizeStartX = 0, resizeStartY = 0, resizeStartW = 0, resizeStartH = 0;

function startDrag(e, panel) {
    dragTarget = panel;
    const rect = panel.getBoundingClientRect();
    dragOffsetX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    dragOffsetY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    panel.style.position = "absolute";
    panel.style.zIndex = "100";
    panel.style.left = rect.left + "px";
    panel.style.top = rect.top + "px";
    panel.style.width = rect.width + "px";
    panel.style.height = rect.height + "px";
}

function moveDrag(e) {
    if(!dragTarget) return;
    e.preventDefault();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - dragOffsetX;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - dragOffsetY;
    dragTarget.style.left = x + "px";
    dragTarget.style.top = y + "px";
}

function endDrag() {
    dragTarget = null;
}

function startResize(e, handle) {
    e.preventDefault();
    e.stopPropagation();
    resizeTarget = handle.closest(".panel-crypto, .panel-ai");
    const rect = resizeTarget.getBoundingClientRect();
    resizeStartX = e.touches ? e.touches[0].clientX : e.clientX;
    resizeStartY = e.touches ? e.touches[0].clientY : e.clientY;
    resizeStartW = rect.width;
    resizeStartH = rect.height;
}

function moveResize(e) {
    if(!resizeTarget) return;
    e.preventDefault();
    const dx = (e.touches ? e.touches[0].clientX : e.clientX) - resizeStartX;
    const dy = (e.touches ? e.touches[0].clientY : e.clientY) - resizeStartY;
    const newW = Math.max(200, resizeStartW + dx);
    const newH = Math.max(150, resizeStartH + dy);
    resizeTarget.style.width = newW + "px";
    resizeTarget.style.height = newH + "px";
}

function endResize() {
    resizeTarget = null;
}

document.addEventListener("mousemove", (e) => { moveDrag(e); moveResize(e); });
document.addEventListener("mouseup", () => { endDrag(); endResize(); });
document.addEventListener("touchmove", (e) => { moveDrag(e); moveResize(e); }, { passive: false });
document.addEventListener("touchend", () => { endDrag(); endResize(); });
addMessage('bot', '👾 <b>MATRIX AI CORE ONLINE</b><br>Digite <b>help</b> ou use <b>analyze [domínio]</b>');
</script>
