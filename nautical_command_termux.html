<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Share+Tech+Mono&display=swap');
:root{--bg:#030912;--panel:rgba(5,16,29,.91);--panel2:rgba(9,28,45,.88);--gold:#e7c65d;--gold2:#a98522;--cyan:#2dd4bf;--cyan2:#0b8f83;--red:#ff4d5f;--orange:#ffad4d;--text:#e9f4f7;--muted:#7890a2;--line:rgba(231,198,93,.32);--shadow:0 12px 35px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.app{height:100%;position:relative}.map{position:absolute;inset:0;z-index:0;background:#06101c}.veil{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle,transparent 48%,rgba(0,0,0,.46) 100%)}
.top{position:absolute;z-index:1000;left:0;right:0;top:0;padding:8px 10px 14px;display:flex;justify-content:space-between;gap:8px;background:linear-gradient(#030912f2,#030912b8,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);flex-wrap:wrap}.brand{display:flex;align-items:center;gap:6px}.brand .mark{font-size:20px;color:var(--gold);text-shadow:0 0 15px #e7c65d66}.brand h1{margin:0;font:700 13px Cinzel;letter-spacing:1.5px;color:var(--gold)}.brand small{display:block;color:var(--muted);font-size:6px;letter-spacing:1px;margin-top:0px}.actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.btn,.side button,.layer{border:1px solid var(--line);background:linear-gradient(145deg,#10283e,#071522);color:var(--cyan);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px #ffffff0a,0 3px 10px #0007;font-size:12px}.btn:hover,.side button:hover,.layer:hover{border-color:var(--gold);color:var(--gold)}.btn.danger{color:var(--red);border-color:#ff4d5f66}.btn.active,.side button.active,.layer.active{background:linear-gradient(145deg,var(--gold),#9d7918);color:#06101c;border-color:var(--gold)}
.status{position:absolute;z-index:1000;top:64px;right:8px;background:var(--panel);border:1px solid var(--cyan2);border-radius:7px;padding:4px 8px;color:var(--cyan);font-size:8px}.status b{color:var(--gold)}.clock{position:absolute;z-index:1000;top:64px;left:70px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px;color:var(--gold);font-size:10px}.compass{position:absolute;z-index:1000;top:60px;left:6px;width:56px;height:56px;border:1px solid var(--gold);border-radius:50%;background:radial-gradient(circle,#163650,#030912 72%);display:grid;place-items:center;box-shadow:var(--shadow)}.rose{width:48px;height:48px;transition:transform .25s}.heading{position:absolute;top:54px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--gold);background:var(--panel);padding:1px 6px;border:1px solid var(--line);border-radius:4px}
.side{position:absolute;z-index:1000;left:5px;top:125px;display:flex;flex-direction:column;gap:4px}.side button{width:30px;height:30px;font-size:12px;padding:0}.instrument{position:absolute;z-index:1000;right:5px;top:125px;width:150px;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:8px;display:none;box-shadow:var(--shadow)}.instrument.show{display:block}.instrument h3{font:600 10px Cinzel;color:var(--gold);margin:0 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.metric{background:#ffffff05;border:1px solid #ffffff08;border-radius:5px;padding:4px 5px}.metric span{display:block;color:var(--muted);font-size:7px}.metric b{color:var(--cyan);font-size:10px}.warning{margin-top:5px;color:var(--orange);font-size:7px;line-height:1.3}
.bottom{position:absolute;z-index:1000;bottom:6px;left:50%;transform:translateX(-50%);max-width:95vw;display:flex;gap:4px;padding:5px 8px;background:var(--panel);border:1px solid var(--gold);border-radius:12px;overflow-x:auto}.layer{height:26px;padding:0 8px;min-width:auto;font-size:7px;white-space:nowrap;border-radius:6px}.coords{position:absolute;z-index:1000;bottom:6px;left:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--gold);font-size:7px}.cross{position:absolute;z-index:5;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none;opacity:.3}.cross:before,.cross:after{content:"";position:absolute;background:var(--gold);box-shadow:0 0 7px var(--gold)}.cross:before{width:1px;height:100%;left:50%}.cross:after{height:1px;width:100%;top:50%}
.alert{position:absolute;z-index:12000;top:44px;left:50%;transform:translateX(-50%);display:none;padding:6px 14px;border-radius:10px;background:linear-gradient(135deg,#ff4d5f,#a8172b);font-size:10px;box-shadow:0 8px 25px #ff4d5f66}.alert.show{display:block;animation:shake .35s}@keyframes shake{25%{transform:translateX(-53%)}75%{transform:translateX(-47%)}}.offline{position:absolute;z-index:12000;top:96px;left:50%;transform:translateX(-50%);display:none;background:var(--orange);color:#1b1104;padding:3px 10px;border-radius:6px;font-size:8px;font-weight:bold}.offline.show{display:block}
.modal-bg{position:fixed;z-index:15000;inset:0;background:#000b;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:14px}.modal-bg.show{display:flex}.modal{width:min(400px,94vw);max-height:80vh;overflow:auto;background:linear-gradient(145deg,#0b2035,#030912);border:1px solid var(--gold);border-radius:15px;padding:14px;box-shadow:0 25px 70px #000}.modal h2{font:600 13px Cinzel;color:var(--gold);margin:0 0 10px}.close{float:right;background:none;border:1px solid var(--red);color:var(--red);border-radius:6px;width:24px;height:24px;font-size:14px;cursor:pointer}.modal label{display:block;color:var(--muted);font-size:8px;margin-top:6px}.modal input,.modal select,.modal textarea{width:100%;background:#020a12;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px;margin-top:3px;font-size:11px}.primary{background:linear-gradient(145deg,var(--gold),#9d7918);color:#06101c;border:0;border-radius:8px;padding:8px 12px;margin-top:8px;font-weight:bold;cursor:pointer}.row{display:flex;gap:6px}.row>*{flex:1}.list{margin-top:8px}.item{padding:5px;border-bottom:1px solid #ffffff12;font-size:8px}.item b{color:var(--gold)}.check{display:flex;gap:6px;padding:6px 2px;border-bottom:1px solid #ffffff0d;font-size:9px}.check input{width:auto}.dangerBox{border:1px solid #ff4d5f66;background:#ff4d5f0d;padding:6px;border-radius:6px;color:#ff9ca6;font-size:8px;margin-top:6px}
.leaflet-control-attribution{background:#030912aa!important;color:#7890a2!important;font-size:7px!important}.leaflet-control-attribution a{color:var(--cyan)!important}.leaflet-control-zoom a{background:var(--panel)!important;color:var(--gold)!important;border-color:var(--line)!important;font-size:14px!important}
@media(max-width:500px){.brand h1{font-size:11px}.brand small{font-size:6px}.actions .btn{width:28px;min-width:28px;height:28px;font-size:10px}.instrument{width:140px}.side{top:115px;left:4px}.side button{width:28px;height:28px;font-size:10px}.bottom{bottom:4px;padding:4px 6px;gap:3px}.layer{height:22px;padding:0 6px;font-size:6px}.coords{bottom:4px;font-size:6px}.clock{left:60px;font-size:9px;top:56px}.compass{width:48px;height:48px;top:52px;left:4px}.rose{width:40px;height:40px}.heading{top:46px;font-size:6px}.status{top:56px;font-size:7px}}
</style></head>
<body><div class="app"><div id="map" class="map"></div><div class="veil"></div><div class="cross"></div>
<header class="top"><div class="brand"><div class="mark">⚓</div><div><h1>BRÚSSOLA COMMAND</h1><small>PONTE DE NAVEGAÇÃO</small></div></div><div class="actions"><button class="btn" onclick="toggleInstruments()" title="Instrumentos">◉</button><button class="btn" onclick="toggleBase()" title="Carta">▣</button><button class="btn" onclick="toggleFullscreen()" title="Tela cheia">⛶</button><button class="btn" onclick="toggleRuler()" title="Régua">↔</button><button class="btn danger" onclick="markMOB()" title="Homem ao mar">⚠</button><button class="btn danger" onclick="sos()" title="SOS">SOS</button></div></header>
<div class="compass"><svg id="rose" class="rose" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#e7c65d"/><polygon points="50,7 44,50 50,53 56,50" fill="#ff4d5f"/><polygon points="50,93 44,50 50,47 56,50" fill="#e9f4f7"/><text x="50" y="20" text-anchor="middle" fill="#e7c65d" font-size="10">N</text><text x="50" y="86" text-anchor="middle" fill="#7890a2" font-size="8">S</text><text x="16" y="53" text-anchor="middle" fill="#7890a2" font-size="8">O</text><text x="84" y="53" text-anchor="middle" fill="#7890a2" font-size="8">L</text><circle cx="50" cy="50" r="2" fill="#e7c65d"/></svg><div id="hdg" class="heading">000°</div></div><div id="clock" class="clock">00:00:00</div><div class="status">● <b id="gps">GPS AGUARDANDO</b></div>
<div class="side"><button onclick="mode('waypoint')" title="Waypoint">⌖</button><button onclick="mode('route')" title="Rota">⌁</button><button onclick="toggleAnchor()" title="Âncora">⚓</button><button onclick="toggleTrack()" title="Trajeto">✧</button><button onclick="toggleAIS()" title="AIS">⛴</button><button onclick="openModal('check')" title="Checklist">☑</button><button onclick="openModal('log')" title="Diário">▤</button><button onclick="openModal('vessel')" title="Embarcação">▰</button><button onclick="openModal('gpx')" title="GPX">⇩</button></div>
<section id="instrument" class="instrument"><h3>PAINEL</h3><div class="grid"><div class="metric"><span>SOG</span><b id="sog">-- kn</b></div><div class="metric"><span>COG</span><b id="cog">--°</b></div><div class="metric"><span>HDG</span><b id="ihdg">--°</b></div><div class="metric"><span>PREC.</span><b id="acc">-- m</b></div><div class="metric"><span>LAT</span><b id="ilat">--</b></div><div class="metric"><span>LON</span><b id="ilng">--</b></div></div><div class="warning">⚠ Dados simulados / sensores reais quando disponíveis</div></section>
<div id="coords" class="coords">LAT --.---- | LON --.----</div><div id="alert" class="alert"></div><div id="offline" class="offline">OFFLINE — FUNÇÕES LOCAIS</div>
<div class="bottom"><button class="layer active" onclick="baseIndex=0;setBase(0)">SAT</button><button class="layer" onclick="baseIndex=1;setBase(1)">CARTA</button><button class="layer" onclick="baseIndex=2;setBase(2)">OSM</button><button class="layer" onclick="layer('sea',this)">⚓ NÁUTICA</button><button class="layer" onclick="layer('labels',this)">RÓTULOS</button><button class="layer" onclick="layer('rain',this)">CHUVA</button></div>
<div id="modalBg" class="modal-bg"></div></div>
<script>
const CFG={lat:-25.8235,lng:-48.5493,zoom:12,anchor:100,gpsMaxAge:3000,gpsTimeout:10000};
const map=L.map('map',{zoomControl:false}).setView([CFG.lat,CFG.lng],CFG.zoom);L.control.zoom({position:'bottomright'}).addTo(map);L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
const base=[L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}),L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19})];let baseIndex=0;base[0].addTo(map);
const overlays={labels:L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{maxZoom:19,opacity:.9}),sea:L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:18,opacity:.8}),rain:L.tileLayer('https://tilecache.rainviewer.com/v2/radar/nowcast/past/{z}/{x}/{y}/2/1_1.png',{maxZoom:10,opacity:.55})};
function setBase(i){map.removeLayer(base[baseIndex]);baseIndex=i;base[i].addTo(map);toast('CARTA: '+['SATÉLITE','OSM','ESCURA'][i])}function toggleBase(){setBase((baseIndex+1)%3)}function layer(n,b){const on=map.hasLayer(overlays[n]);on?map.removeLayer(overlays[n]):overlays[n].addTo(map);b.classList.toggle('active',!on)}
let gps={lat:null,lng:null,speed:0,heading:null,accuracy:null},marker=null,accuracyCircle=null,watch=null;
function startGPS(){if(!navigator.geolocation){gpsMsg('GPS INDISPONÍVEL');return}watch=navigator.geolocation.watchPosition(p=>{gps.lat=p.coords.latitude;gps.lng=p.coords.longitude;gps.speed=p.coords.speed||0;gps.heading=p.coords.heading;gps.accuracy=p.coords.accuracy;updateGPS()},e=>gpsMsg('GPS '+(['','PERMISSÃO NEGADA','POSIÇÃO INDISPONÍVEL','TIMEOUT'][e.code]||'ERRO')),{enableHighAccuracy:true,maximumAge:CFG.gpsMaxAge,timeout:CFG.gpsTimeout})}
function updateGPS(){const {lat,lng}=gps;document.getElementById('gps').textContent='GPS OK';document.getElementById('coords').textContent=`LAT ${lat.toFixed(5)} | LON ${lng.toFixed(5)}`;document.getElementById('ilat').textContent=lat.toFixed(5);document.getElementById('ilng').textContent=lng.toFixed(5);document.getElementById('acc').textContent=(gps.accuracy||0).toFixed(0)+' m';const kn=gps.speed*1.943844;document.getElementById('sog').textContent=kn.toFixed(1)+' kn';if(gps.heading!=null&&!Number.isNaN(gps.heading)){setHeading(gps.heading)}else if(track.length>1){setHeading(bearing(track[track.length-2],track.at(-1)))}if(!marker){marker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div style="font-size:22px;filter:drop-shadow(0 0 7px #2dd4bf)">▲</div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);accuracyCircle=L.circle([lat,lng],{radius:gps.accuracy||30,color:'#2dd4bf',fillOpacity:.03,weight:1}).addTo(map);map.setView([lat,lng],14)}else{marker.setLatLng([lat,lng]);accuracyCircle.setLatLng([lat,lng]).setRadius(gps.accuracy||30)}if(tracking)addTrackPoint();checkAnchor()}
function gpsMsg(x){document.getElementById('gps').textContent=x;toast(x)}
function setHeading(h){h=(h+360)%360;document.getElementById('hdg').textContent=String(Math.round(h)).padStart(3,'0')+'°';document.getElementById('ihdg').textContent=Math.round(h)+'°';document.getElementById('cog').textContent=Math.round(h)+'°';document.getElementById('rose').style.transform=`rotate(${-h}deg)`}
window.addEventListener('deviceorientationabsolute',e=>{if(typeof e.alpha==='number'&&gps.heading==null)setHeading(360-e.alpha)});
let track=[],trackLine=null,tracking=false;function toggleTrack(){tracking=!tracking;toast(tracking?'TRAJETO GRAVANDO':'TRAJETO PAUSADO');if(tracking)addTrackPoint()};function addTrackPoint(){if(gps.lat==null)return;const p=[gps.lat,gps.lng];if(!track.length||distance(track.at(-1),p)>3){track.push(p);if(trackLine)map.removeLayer(trackLine);trackLine=L.polyline(track,{color:'#2dd4bf',weight:3,opacity:.8}).addTo(map)}}
let anchor=null,anchorCircle=null;function toggleAnchor(){if(!gps.lat){toast('AGUARDANDO GPS');return}if(anchor){anchor=null;if(anchorCircle)map.removeLayer(anchorCircle);toast('ÂNCORA DESATIVADA')}else{anchor=[gps.lat,gps.lng];anchorCircle=L.circle(anchor,{radius:CFG.anchor,color:'#ff4d5f',dashArray:'7 5',fillOpacity:.04}).addTo(map);toast('ÂNCORA ARMADA • 100m')}}function checkAnchor(){if(!anchor||!gps.lat)return;const d=distance(anchor,[gps.lat,gps.lng]);if(d>CFG.anchor){toast('⚠ DERIVA: '+Math.round(d)+'m');navigator.vibrate?.([200,100,200])}}
function distance(a,b){const R=6371000,la=a[0]*Math.PI/180,lb=b[0]*Math.PI/180,dl=(b[0]-a[0])*Math.PI/180,dg=(b[1]-a[1])*Math.PI/180;const x=Math.sin(dl/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dg/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function bearing(a,b){const la=a[0]*Math.PI/180,lb=b[0]*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180;return (Math.atan2(Math.sin(dl)*Math.cos(lb),Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dl))*180/Math.PI+360)%360}
let modeName=null,route=[],routeLine=null;function mode(m){modeName=modeName===m?null:m;toast(modeName?m.toUpperCase()+' • TOQUE NO MAPA':'MODO DESATIVADO')}map.on('click',e=>{if(!modeName)return;const p=[e.latlng.lat,e.latlng.lng];if(modeName==='waypoint'){L.marker(p).addTo(map).bindPopup('<b>WAYPOINT</b><br>'+p[0].toFixed(5)+', '+p[1].toFixed(5)).openPopup();modeName=null}else if(modeName==='route'){route.push(p);if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline(route,{color:'#e7c65d',weight:3,dashArray:'8 5'}).addTo(map);toast('ROTA #'+route.length)}});
let ruler=false,rpoints=[];function toggleRuler(){ruler=!ruler;rpoints=[];toast(ruler?'RÉGUA ATIVA • 2 pontos':'RÉGUA DESATIVADA')}map.on('click',e=>{if(!ruler)return;rpoints.push([e.latlng.lat,e.latlng.lng]);L.circleMarker(e.latlng,{radius:4,color:'#e7c65d'}).addTo(map);if(rpoints.length===2){toast('DISTÂNCIA: '+(distance(rpoints[0],rpoints[1])/1852).toFixed(2)+' NM');ruler=false;rpoints=[]}});
let ais=[];function toggleAIS(){ais.forEach(x=>map.removeLayer(x));ais=[];if(!gps.lat){toast('GPS necessário');return}for(let i=0;i<6;i++){const p=[gps.lat+(Math.random()-.5)*.12,gps.lng+(Math.random()-.5)*.12];const m=L.circleMarker(p,{radius:5,color:'#ffad4d',fillOpacity:.8}).addTo(map);m.bindPopup('<b>AIS SIMULADO</b>');ais.push(m)}toast('AIS ATIVADO • ALVOS SIMULADOS')}
function markMOB(){if(!gps.lat){toast('GPS necessário');return}const m=L.marker([gps.lat,gps.lng]).addTo(map).bindPopup('<b>⚠ MOB</b><br>'+gps.lat.toFixed(5)+', '+gps.lng.toFixed(5)).openPopup();toast('MOB MARCADO');navigator.vibrate?.([300,100,300])}function sos(){if(!gps.lat){toast('GPS necessário');return}const text=`SOS — ${gps.lat.toFixed(5)}, ${gps.lng.toFixed(5)}`;navigator.share?navigator.share({title:'SOS',text}).catch(()=>{}):prompt('SOS',text);toast('SOS PREPARADO')}
function openModal(type){const bg=document.getElementById('modalBg');let html='';if(type==='check')html=`<div class="modal"><button class="close" onclick="closeModal()">×</button><h2>CHECKLIST</h2>${['Documentos','Combustível','Colete','Âncora','Rádio','Lanterna','Água','Primeiros socorros','Bateria'].map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}">${x}</label>`).join('')}<button class="primary" onclick="toast('CHECKLIST SALVO');closeModal()">Salvar</button></div>`;if(type==='log')html=`<div class="modal"><button class="close" onclick="closeModal()">×</button><h2>DIÁRIO</h2><textarea id="note" rows="3" placeholder="Observações..."></textarea><button class="primary" onclick="saveLog()">Registrar</button><div id="logs" class="list"></div></div>`;if(type==='vessel')html=`<div class="modal"><button class="close" onclick="closeModal()">×</button><h2>EMBARCAÇÃO</h2><label>Nome</label><input id="vname" placeholder="Nome"><label>Calado (m)</label><input id="vdraft" type="number" step="0.1" value="1.5"><label>Capitão</label><input id="vcaptain" placeholder="Capitão"><button class="primary" onclick="saveVessel()">Salvar</button></div>`;if(type==='gpx')html=`<div class="modal"><button class="close" onclick="closeModal()">×</button><h2>EXPORTAR</h2><button class="primary" onclick="exportGPX()">GPX</button><button class="primary" onclick="exportCSV()">CSV</button><div class="dangerBox">Confirme os dados antes de usar.</div></div>`;bg.innerHTML=html;bg.classList.add('show');if(type==='log')loadLogs();if(type==='vessel')loadVessel()}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
function saveLog(){const n=document.getElementById('note').value.trim();if(!n)return;const logs=JSON.parse(localStorage.nautLogs||'[]');logs.unshift({n,t:new Date().toLocaleString('pt-BR'),lat:gps.lat,lng:gps.lng});localStorage.nautLogs=JSON.stringify(logs);document.getElementById('note').value='';loadLogs();toast('REGISTRADO')}function loadLogs(){const a=JSON.parse(localStorage.nautLogs||'[]');document.getElementById('logs').innerHTML=a.map(x=>`<div class="item"><b>${x.t}</b><br>${x.n}<br><span style="color:var(--muted)">${x.lat!=null?x.lat.toFixed(5)+' / '+x.lng.toFixed(5):'sem GPS'}</span></div>`).join('')||'<div class="item">Sem registros.</div>'}
function saveVessel(){localStorage.vessel=JSON.stringify({name:vname.value,draft:vdraft.value,captain:vcaptain.value});toast('SALVO');closeModal()}function loadVessel(){const v=JSON.parse(localStorage.vessel||'{}');vname.value=v.name||'';vdraft.value=v.draft||1.5;vcaptain.value=v.captain||''}
function exportGPX(){const pts=track.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date().toISOString()}</time></trkpt>`).join('');download('brussola-track.gpx',`<?xml version="1.0"?><gpx><trk><trkseg>${pts}</trkseg></trk></gpx>`)}function exportCSV(){download('brussola-track.csv','lat,lon\n'+track.map(p=>p.join(',')).join('\n'))}function download(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast('EXPORTADO')}
function toggleInstruments(){document.getElementById('instrument').classList.toggle('show')}function toggleFullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}function toast(msg){const a=document.getElementById('alert');a.textContent=msg;a.classList.add('show');clearTimeout(window.toastT);window.toastT=setTimeout(()=>a.classList.remove('show'),2200);navigator.vibrate?.(40)}function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('pt-BR')}setInterval(tick,1000);tick();window.addEventListener('online',()=>document.getElementById('offline').classList.remove('show'));window.addEventListener('offline',()=>document.getElementById('offline').classList.add('show'));startGPS();
</script><script src="/fullscreen-helper.js"></script>
</body></html>
