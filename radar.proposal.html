<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MATRIX OS // GLOBAL CAPTAIN FLIGHT RADAR</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cockpit-dark: #03080c;
            --neon-green: #00ff55;
            --neon-cyan: #00f0ff;
            --neon-amber: #ffb700;
            --glass-bg: rgba(3, 15, 10, 0.88);
            --border-glow: rgba(0, 255, 85, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            color: var(--neon-green);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* === MAP FULLSCREEN === */
        #radarMap {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #010604;
        }

        .leaflet-container { background: #010604 !important; }
        .leaflet-popup-content-wrapper {
            background: rgba(2, 12, 8, 0.92) !important;
            border: 1px solid var(--neon-green) !important;
            color: #fff !important;
            border-radius: 12px !important;
            box-shadow: 0 0 20px rgba(0, 255, 85, 0.2) !important;
            backdrop-filter: blur(8px);
        }
        .leaflet-popup-tip { background: var(--neon-green) !important; }

        .hud-scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            opacity: 0.6;
        }

        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 100;
            background: var(--glass-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 10px 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 30px rgba(0, 255, 85, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .brand-title span { color: var(--neon-cyan); }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(0, 255, 85, 0.06);
            border: 1px solid rgba(0, 255, 85, 0.2);
            border-radius: 20px;
            padding: 4px 10px;
            width: 160px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            width: 100%;
        }

        .search-box input::placeholder { color: rgba(0, 255, 85, 0.4); }

        .close-btn {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover { background: #ff3333; color: #000; box-shadow: 0 0 15px #ff3333; }

        .cockpit-hud {
            position: fixed;
            top: 76px;
            left: 12px;
            z-index: 100;
            background: var(--glass-bg);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 10px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .hud-metric {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px dashed rgba(0, 255, 85, 0.15);
            padding-bottom: 4px;
        }

        .hud-metric .val { color: var(--neon-cyan); font-weight: bold; }

        .flight-panel {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 100;
            background: var(--glass-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 14px 18px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 255, 85, 0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: translateY(120%);
            transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .flight-panel.active { transform: translateY(0); }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flight-callsign {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .aircraft-model {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--neon-amber);
            border: 1px solid var(--neon-amber);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .flight-route {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 255, 85, 0.04);
            border: 1px dashed rgba(0, 255, 85, 0.2);
            border-radius: 12px;
            padding: 8px 12px;
            font-family: 'Share Tech Mono', monospace;
        }

        .airport {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .airport .code { font-size: 16px; font-weight: bold; color: var(--neon-green); }
        .airport .city { font-size: 9px; color: rgba(255, 255, 255, 0.6); }

        .route-line {
            flex: 1;
            margin: 0 12px;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            position: relative;
        }

        .route-line::after {
            content: '✈';
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #fff;
        }

        .flight-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
        }

        .stat-box {
            background: rgba(0, 255, 85, 0.03);
            border: 1px solid rgba(0, 255, 85, 0.1);
            border-radius: 8px;
            padding: 6px 4px;
        }

        .stat-box .v { font-size: 12px; color: #fff; font-weight: bold; }
        .stat-box .l { font-size: 8px; color: rgba(255, 255, 255, 0.5); }

        .bottom-status-bar {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            background: var(--glass-bg);
            border: 1px solid var(--border-glow);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .blink-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .plane-marker {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }

        .plane-marker svg {
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 6px rgba(0, 255, 85, 0.8));
        }

        /* Airport Marker Badge */
        .airport-badge {
            background: rgba(0, 240, 255, 0.9);
            color: #000;
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid #fff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
            text-align: center;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .cockpit-hud { display: none; }
            .top-bar { padding: 8px 12px; }
            .brand-title { font-size: 11px; }
            .search-box { width: 110px; }
            .flight-stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div id="radarMap"></div>
<div class="hud-scanlines"></div>

<div class="top-bar">
    <div class="brand-title">
        <span>✈</span> MATRIX GLOBAL RADAR
    </div>
    <div class="search-box">
        <input type="text" id="searchFlight" placeholder="Buscar Voo..." onkeyup="filterFlights()">
    </div>
    <button class="close-btn" onclick="window.location.href='/index.html'">✕ SAIR</button>
</div>

<div class="cockpit-hud">
    <div class="hud-metric"><span>COVERAGE:</span> <span class="val">WORLDWIDE</span></div>
    <div class="hud-metric"><span>MODE:</span> <span class="val">ADS-B GLOBAL</span></div>
    <div class="hud-metric"><span>TRAFFIC:</span> <span class="val" id="hudTrafficCount">0 ACFT</span></div>
    <div class="hud-metric"><span>FREQ:</span> <span class="val">121.50 MHz</span></div>
</div>

<div class="flight-panel" id="flightPanel">
    <div class="panel-header">
        <div class="flight-callsign">
            <span>✈</span> <span id="pCallsign">GLO1234</span>
        </div>
        <div class="aircraft-model" id="pModel">BOEING 787 DREAMLINER</div>
        <button class="close-btn" style="padding: 2px 8px;" onclick="closePanel()">✕</button>
    </div>

    <div class="flight-route">
        <div class="airport">
            <span class="code" id="pOrigin">GRU</span>
            <span class="city" id="pOriginCity">SÃO PAULO</span>
        </div>
        <div class="route-line"></div>
        <div class="airport">
            <span class="code" id="pDest">JFK</span>
            <span class="city" id="pDestCity">NEW YORK</span>
        </div>
    </div>

    <div class="flight-stats-grid">
        <div class="stat-box"><div class="v" id="pAlt">38,000 FT</div><div class="l">ALTITUDE</div></div>
        <div class="stat-box"><div class="v" id="pSpeed">510 KTS</div><div class="l">VELOCIDADE</div></div>
        <div class="stat-box"><div class="v" id="pHeading">045°</div><div class="l">PROA (PRO)</div></div>
        <div class="stat-box"><div class="v" id="pSquawk">7000</div><div class="l">SQUAWK</div></div>
    </div>
</div>

<div class="bottom-status-bar" id="bottomStatus">
    <div class="blink-dot"></div>
    <span id="statusCounter">Aguardando telemetria global...</span>
</div>

<script>
// AUTO FULLSCREEN ON FIRST INTERACTION
['click', 'touchstart'].forEach(eventType => {
    document.addEventListener(eventType, function autoFS() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) { elem.requestFullscreen().catch(() => {}); }
        else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
    }, { once: true });
});

const map = L.map('radarMap', {
    center: [20.0, 0.0], // Global Center
    zoom: 3,
    zoomControl: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 18
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

let planeMarkers = {};
let activeRoutePolyline = null;
let activeAirportMarkers = [];
let currentSelectedIcao = null;

function createPlaneSvg(color, heading) {
    return `<div class="plane-marker" style="transform: rotate(${heading}deg);">
        <svg viewBox="0 0 24 24" fill="${color}" stroke="#000" stroke-width="0.8">
            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
    </div>`;
}

/* WORLDWIDE AIRPORTS LIST */
const WORLD_AIRPORTS = [
    { code: 'GRU', city: 'SÃO PAULO', lat: -23.4356, lng: -46.4731 },
    { code: 'GIG', city: 'RIO JANEIRO', lat: -22.8089, lng: -43.2436 },
    { code: 'BSB', city: 'BRASÍLIA', lat: -15.8697, lng: -47.9208 },
    { code: 'JFK', city: 'NEW YORK', lat: 40.6413, lng: -73.7781 },
    { code: 'LHR', city: 'LONDRES', lat: 51.4700, lng: -0.4543 },
    { code: 'CDG', city: 'PARIS', lat: 49.0097, lng: 2.5479 },
    { code: 'HND', city: 'TÓQUIO', lat: 35.5494, lng: 139.7798 },
    { code: 'DXB', city: 'DUBAI', lat: 25.2532, lng: 55.3657 },
    { code: 'SYD', city: 'SYDNEY', lat: -33.9399, lng: 151.1753 },
    { code: 'FRA', city: 'FRANKFURT', lat: 50.0379, lng: 8.5622 },
    { code: 'EZE', city: 'BUENOS AIRES', lat: -34.8222, lng: -58.5358 },
    { code: 'MIA', city: 'MIAMI', lat: 25.7959, lng: -80.2870 }
];

const MODELS = ['BOEING 787-9', 'AIRBUS A350-1000', 'BOEING 777-300ER', 'AIRBUS A330neo', 'EMBRAER E195-E2'];

function generateSimulatedWorldwideFlights() {
    const flights = [];
    for (let i = 0; i < 32; i++) {
        const origIndex = i % WORLD_AIRPORTS.length;
        const destIndex = (i + 5) % WORLD_AIRPORTS.length;
        const orig = WORLD_AIRPORTS[origIndex];
        const dest = WORLD_AIRPORTS[destIndex];

        const progress = ((Date.now() / 1000 + i * 250) % 3600) / 3600;
        const lat = orig.lat + (dest.lat - orig.lat) * progress;
        const lng = orig.lng + (dest.lng - orig.lng) * progress;
        const heading = (Math.atan2(dest.lng - orig.lng, dest.lat - orig.lat) * (180 / Math.PI) + 360) % 360;

        flights.push({
            icao24: `WLD${100 + i}`,
            callsign: `FLT${1000 + i}`,
            lat,
            lng,
            altitude: 10000 + (i * 300),
            speed: 240 + (i * 5),
            heading,
            squawk: '7000',
            orig,
            dest,
            model: MODELS[i % MODELS.length]
        });
    }
    return flights;
}

function renderFlightData(flights) {
    const activeIds = new Set();
    let count = 0;

    flights.forEach(f => {
        activeIds.add(f.icao24);
        count++;

        const pos = [f.lat, f.lng];
        const altFt = Math.round(f.altitude * 3.28084);
        const speedKts = Math.round(f.speed * 1.94384);

        const planeIcon = L.divIcon({
            className: '',
            html: createPlaneSvg(currentSelectedIcao === f.icao24 ? '#00f0ff' : '#00ff55', f.heading),
            iconSize: [26, 26],
            iconAnchor: [13, 13]
        });

        if (planeMarkers[f.icao24]) {
            planeMarkers[f.icao24].setLatLng(pos);
            planeMarkers[f.icao24].setIcon(planeIcon);
        } else {
            const marker = L.marker(pos, { icon: planeIcon }).addTo(map);
            marker.on('click', () => {
                selectFlight(f, altFt, speedKts);
            });
            planeMarkers[f.icao24] = marker;
        }

        // Update route polyline if selected
        if (currentSelectedIcao === f.icao24 && activeRoutePolyline) {
            drawFlightRoute(f.orig, [f.lat, f.lng], f.dest);
        }
    });

    for (const id in planeMarkers) {
        if (!activeIds.has(id)) {
            map.removeLayer(planeMarkers[id]);
            delete planeMarkers[id];
        }
    }

    document.getElementById('statusCounter').innerText = `RADAR GLOBAL: ${count} TRAFEGOS INTERCONTINENTAIS ATIVOS`;
    document.getElementById('hudTrafficCount').innerText = `${count} ACFT`;
}

function drawFlightRoute(orig, currentPos, dest) {
    if (activeRoutePolyline) map.removeLayer(activeRoutePolyline);
    activeAirportMarkers.forEach(m => map.removeLayer(m));
    activeAirportMarkers = [];

    const routePoints = [
        [orig.lat, orig.lng],
        currentPos,
        [dest.lat, dest.lng]
    ];

    activeRoutePolyline = L.polyline(routePoints, {
        color: '#00f0ff',
        weight: 3,
        dashArray: '6, 8',
        opacity: 0.9
    }).addTo(map);

    // Origin Badge
    const origIcon = L.divIcon({
        className: '',
        html: `<div class="airport-badge">🛫 ${orig.code}</div>`,
        iconAnchor: [20, 10]
    });
    const origMarker = L.marker([orig.lat, orig.lng], { icon: origIcon }).addTo(map);

    // Dest Badge
    const destIcon = L.divIcon({
        className: '',
        html: `<div class="airport-badge">🛬 ${dest.code}</div>`,
        iconAnchor: [20, 10]
    });
    const destMarker = L.marker([dest.lat, dest.lng], { icon: destIcon }).addTo(map);

    activeAirportMarkers.push(origMarker, destMarker);
}

function selectFlight(f, altFt, speedKts) {
    currentSelectedIcao = f.icao24;
    document.getElementById('pCallsign').innerText = f.callsign;
    document.getElementById('pModel').innerText = f.model;
    document.getElementById('pOrigin').innerText = f.orig.code;
    document.getElementById('pOriginCity').innerText = f.orig.city;
    document.getElementById('pDest').innerText = f.dest.code;
    document.getElementById('pDestCity').innerText = f.dest.city;
    document.getElementById('pAlt').innerText = `${altFt.toLocaleString()} FT`;
    document.getElementById('pSpeed').innerText = `${speedKts} KTS`;
    document.getElementById('pHeading').innerText = `${Math.round(f.heading)}°`;
    document.getElementById('pSquawk').innerText = f.squawk;

    document.getElementById('flightPanel').classList.add('active');

    drawFlightRoute(f.orig, [f.lat, f.lng], f.dest);

    if (planeMarkers[f.icao24]) {
        map.panTo(planeMarkers[f.icao24].getLatLng(), { animate: true });
    }
}

function closePanel() {
    document.getElementById('flightPanel').classList.remove('active');
    if (activeRoutePolyline) { map.removeLayer(activeRoutePolyline); activeRoutePolyline = null; }
    activeAirportMarkers.forEach(m => map.removeLayer(m));
    activeAirportMarkers = [];
    currentSelectedIcao = null;
}

function filterFlights() {
    const query = document.getElementById('searchFlight').value.toUpperCase();
    if (!query) return;

    for (const id in planeMarkers) {
        const marker = planeMarkers[id];
        const match = id.toUpperCase().includes(query);
        marker.setOpacity(match ? 1 : 0.2);
    }
}

async function fetchFlightTelemetry() {
    try {
        const res = await fetch('/api/flights', { signal: AbortSignal.timeout(3500) });
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data.states && data.states.length > 0) {
            // Process real API data
            return;
        }
    } catch (e) {
        renderFlightData(generateSimulatedWorldwideFlights());
    }
}

fetchFlightTelemetry();
setInterval(fetchFlightTelemetry, 3000);
</script>
</body>
</html>
