<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Gerador OG Image</title>
<style>
body{background:#030504;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;flex-direction:column;gap:20px}
canvas{width:600px;height:315px;border:2px solid #00ff41;border-radius:10px}
button{background:#00ff41;color:#000;border:0;padding:12px 30px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:#4dff88}
a{color:#00ff41;text-decoration:none}
</style>
</head>
<body>
<canvas id="ogCanvas" width="1200" height="630"></canvas>
<button onclick="generate()">🔄 GERAR IMAGEM</button>
<a href="#" id="downloadLink" download="og-image.png">📥 BAIXAR PNG</a>
<script>
function generate() {
    const canvas = document.getElementById('ogCanvas');
    const ctx = canvas.getContext('2d');

    // Fundo
    const grad = ctx.createRadialGradient(600, 300, 50, 600, 300, 600);
    grad.addColorStop(0, '#0a1a0f');
    grad.addColorStop(1, '#030504');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1200, 630);

    // Grid
    ctx.strokeStyle = 'rgba(0,255,65,0.05)';
    ctx.lineWidth = 1;
    for(let i=0;i<1200;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,630);ctx.stroke()}
    for(let i=0;i<630;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(1200,i);ctx.stroke()}

    // Glow
    const glow = ctx.createRadialGradient(600, 200, 50, 600, 200, 400);
    glow.addColorStop(0, 'rgba(0,255,65,0.08)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, 1200, 630);

    // Título principal
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = '700 56px Orbitron, sans-serif';
    ctx.shadowColor = 'rgba(0,255,65,0.3)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#00ff41';
    ctx.fillText('⬡ MATRIX OS', 600, 200);
    ctx.shadowBlur = 0;

    ctx.font = '400 24px Rajdhani, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('MENTORIA 1:1 · APP PUBLICADO EM 30 DIAS', 600, 260);

    // Linha
    ctx.strokeStyle = 'rgba(0,255,65,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(450, 290);
    ctx.lineTo(750, 290);
    ctx.stroke();

    // Preço
    ctx.font = '900 64px Orbitron, sans-serif';
    ctx.shadowColor = 'rgba(255,176,0,0.2)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#ffb000';
    ctx.fillText('R$ 497', 600, 380);
    ctx.shadowBlur = 0;

    // Tags
    ctx.font = '400 16px Share Tech Mono, monospace';
    ctx.fillStyle = '#00ff41';
    ctx.strokeStyle = 'rgba(0,255,65,0.2)';
    ctx.lineWidth = 1;
    const tags = ['4 ENCONTROS 1:1', 'GARANTIA DE 7 DIAS', 'SUPORTE NO TELEGRAM'];
    tags.forEach((tag, i) => {
        const x = 600 - 140 + i * 140;
        ctx.fillStyle = 'rgba(0,255,65,0.08)';
        ctx.roundRect(x-70, 460, 140, 36, 18);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,255,65,0.2)';
        ctx.roundRect(x-70, 460, 140, 36, 18);
        ctx.stroke();
        ctx.fillStyle = 'rgba(0,255,65,0.7)';
        ctx.font = '400 12px Share Tech Mono, monospace';
        ctx.fillText(tag, x, 478);
    });

    // Rodapé
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.font = '400 12px Share Tech Mono, monospace';
    ctx.fillText('ELTON CEO DEV · NODE.JS & PYTHON', 600, 570);

    // Download
    const link = document.getElementById('downloadLink');
    link.href = canvas.toDataURL('image/png');
}

// Helper roundRect
CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    return this;
};

generate();
</script>
</body>
</html>
