<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BRÚSSOLA — Navegação Satélite</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Share+Tech+Mono&display=swap');

:root {
  --navy-950:#050b14;
  --navy-900:#0a1628;
  --navy-800:#0f2138;
  --navy-700:#16304f;
  --brass:#c9a227;
  --brass-light:#f0d878;
  --brass-dim:rgba(201,162,39,0.35);
  --teal:#2dd4bf;
  --teal-glow:rgba(45,212,191,0.45);
  --red:#ff4757;
  --orange:#ffa94d;
  --ink:#e9f1f4;
  --ink-dim:#7f95a8;
  --glass:rgba(6,16,28,0.86);
  --glass-light:rgba(14,28,46,0.72);
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--navy-950); font-family:'Share Tech Mono',monospace; color:var(--ink); }
.title-face { font-family:'Cinzel',serif; }

body::before {
  content:''; position:fixed; inset:0; z-index:9999; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(2,6,12,0.55) 100%);
}

#particleCanvas { position:fixed; inset:0; z-index:4; pointer-events:none; }
#weatherMap { position:absolute; top:0; left:0; width:100%; height:100vh; z-index:0; background:#050505; }
.leaflet-control-attribution { background:rgba(5,11,20,0.65) !important; color:var(--ink-dim) !important; font-family:'Share Tech Mono',monospace; font-size:9px !important; }
.leaflet-control-attribution a { color:var(--teal) !important; }
.leaflet-control-zoom a { background:var(--glass) !important; color:var(--brass-light) !important; border:1px solid var(--brass-dim) !important; }
.leaflet-control-scale-line { background:var(--glass) !important; border-color:var(--brass-dim) !important; color:var(--ink) !important; }
.leaflet-popup-content-wrapper { background:var(--glass); border:1px solid var(--brass); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
.leaflet-popup-tip { background:var(--glass); border:1px solid var(--brass-dim); }
.leaflet-popup-content { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--ink); margin:10px 12px; line-height:1.6; }
.leaflet-popup-content b { color:var(--brass-light); font-family:'Cinzel',serif; letter-spacing:0.5px; }
.leaflet-popup-close-button { color:var(--teal) !important; font-size:16px !important; }
.leaflet-popup-close-button:hover { color:var(--brass-light) !important; }
.leaflet-tooltip { background:var(--glass) !important; border:1px solid var(--brass-dim) !important; color:var(--ink) !important; font-family:'Share Tech Mono',monospace; font-size:9px !important; }

.crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:26px; height:26px; pointer-events:none; z-index:6; opacity:0.55; }
.crosshair::before,.crosshair::after { content:''; position:absolute; background:var(--brass-light); box-shadow:0 0 6px var(--brass); }
.crosshair::before { width:1px; height:100%; left:50%; top:0; }
.crosshair::after { width:100%; height:1px; top:50%; left:0; }

.header {
  position:absolute; top:0; left:0; width:100%; z-index:1000;
  background:linear-gradient(180deg, rgba(5,11,20,0.96) 0%, rgba(5,11,20,0.78) 70%, transparent 100%);
  backdrop-filter:blur(14px);
  padding:10px 14px 16px;
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  border-bottom:1px solid var(--brass-dim);
}
.brand { display:flex; align-items:center; gap:8px; }
.brand-mark { width:30px; height:30px; flex-shrink:0; }
.brand-text h1 {
  font-family:'Cinzel',serif; font-size:15px; font-weight:600; color:var(--brass-light);
  letter-spacing:2.5px; text-shadow:0 0 14px rgba(240,216,120,0.35);
}
.brand-text p { font-size:8.5px; letter-spacing:2px; color:var(--ink-dim); margin-top:2px; text-transform:uppercase; }

.header-btns { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.icon-btn {
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(145deg, var(--navy-800), var(--navy-900));
  border:1px solid var(--brass-dim);
  color:var(--teal);
  cursor:pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 2px 6px rgba(0,0,0,0.4);
  transition: all .15s ease;
}
.icon-btn svg { width:17px; height:17px; }
.icon-btn:active { transform:scale(0.92); }
.icon-btn:hover { border-color:var(--brass); color:var(--brass-light); box-shadow:0 0 10px var(--teal-glow), inset 0 1px 0 rgba(255,255,255,0.06); }
.icon-btn.danger { color:var(--red); border-color:rgba(255,71,87,0.4); }
.icon-btn.danger:hover { border-color:var(--red); box-shadow:0 0 12px rgba(255,71,87,0.5); }
.icon-btn.on { color:var(--navy-950); background:linear-gradient(145deg, var(--brass-light), var(--brass)); border-color:var(--brass-light); }

#compassWidget {
  position:absolute; top:70px; left:8px; z-index:1000;
  width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--navy-700), var(--navy-950) 75%);
  border:1.5px solid var(--brass);
  box-shadow:0 0 0 1px rgba(0,0,0,0.5), 0 4px 14px rgba(0,0,0,0.5), inset 0 0 12px rgba(0,0,0,0.6);
  display:flex; align-items:center; justify-content:center;
}
#compassRose { width:56px; height:56px; transition: transform .3s ease-out; }
#compassWidget .hdg-readout {
  position:absolute; bottom:-16px; left:50%; transform:translateX(-50%);
  font-size:8px; color:var(--brass-light); background:var(--glass); padding:1px 6px; border-radius:6px; border:1px solid var(--brass-dim);
  white-space:nowrap;
}

#matrixClock {
  position:absolute; top:70px; left:80px; z-index:1000;
  background:var(--glass); border:1px solid var(--brass-dim);
  padding:5px 11px; border-radius:10px; font-size:12px; color:var(--brass-light); letter-spacing:1px;
}
.status-bar {
  position:absolute; top:70px; right:8px; z-index:1000;
  background:var(--glass); border:1px solid var(--teal); color:var(--teal);
  padding:5px 11px; border-radius:10px; font-size:10px; display:flex; gap:5px; align-items:center;
}
#coordsBar {
  position:absolute; bottom:26px; left:8px; z-index:1000;
  background:var(--glass); border:1px solid var(--brass-dim);
  padding:4px 9px; border-radius:8px; font-size:9px; color:var(--brass-light);
}

.instrument-panel {
  position:absolute; top:150px; right:8px; z-index:1000;
  background:var(--glass); border:1px solid var(--brass); border-radius:14px;
  padding:10px; width:150px; display:none;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.instrument-panel.visible { display:block; }
.inst-title {
  font-family:'Cinzel',serif; color:var(--brass-light); font-size:10px; font-weight:600; letter-spacing:1.5px;
  text-align:center; border-bottom:1px solid var(--brass-dim); padding-bottom:6px; margin-bottom:6px;
}
.inst-row { display:flex; justify-content:space-between; font-size:10px; margin:4px 0; color:var(--ink-dim); }
.inst-val { color:var(--teal); font-weight:bold; text-shadow:0 0 6px var(--teal-glow); }

.side-menu {
  position:absolute; top:150px; left:8px; z-index:1000;
  background:var(--glass); border:1px solid var(--brass-dim); border-radius:14px;
  padding:6px; display:flex; flex-direction:column; gap:5px;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.side-btn {
  width:34px; height:34px; border-radius:9px;
  background:linear-gradient(145deg, var(--navy-800), var(--navy-900));
  border:1px solid var(--brass-dim); color:var(--teal); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all .15s ease;
}
.side-btn svg { width:16px; height:16px; }
.side-btn:hover { border-color:var(--brass); color:var(--brass-light); }
.side-btn.active { background:linear-gradient(145deg, var(--brass-light), var(--brass)); color:var(--navy-950); border-color:var(--brass-light); }

.modal-overlay { position:fixed; inset:0; z-index:15000; background:rgba(2,6,12,0.85); display:none; align-items:center; justify-content:center; backdrop-filter:blur(3px); }
.modal-overlay.visible { display:flex; }
.modal {
  background:linear-gradient(150deg, var(--navy-900) 0%, var(--navy-950) 100%);
  border:1px solid var(--brass); border-radius:16px; padding:18px; width:90%; max-width:400px; max-height:80vh; overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
.modal-title { font-family:'Cinzel',serif; color:var(--brass-light); font-size:13px; font-weight:600; letter-spacing:1px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
.modal-close { background:none; border:1px solid var(--red); color:var(--red); width:24px; height:24px; border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-close svg { width:12px; height:12px; }
input,select,textarea {
  background:rgba(5,14,26,0.7); border:1px solid var(--brass-dim); color:var(--ink); padding:8px 10px; border-radius:8px;
  font-family:inherit; font-size:11px; width:100%; margin:4px 0;
}
input:focus, textarea:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 2px var(--teal-glow); }
label { font-size:10px; color:var(--ink-dim); margin-top:8px; display:block; letter-spacing:0.5px; }
.btn-primary {
  background:linear-gradient(145deg, var(--brass-light), var(--brass)); border:none; color:var(--navy-950);
  padding:9px 16px; border-radius:9px; cursor:pointer; font-family:inherit; font-weight:bold; font-size:11px; margin-top:10px;
  box-shadow:0 3px 10px rgba(201,162,39,0.35);
}
.btn-primary:active { transform:scale(0.97); }

.alert-banner {
  position:absolute; top:56px; left:50%; transform:translateX(-50%); z-index:10000;
  background:linear-gradient(135deg, #ff4757, #c62835); color:#fff; padding:7px 18px; border-radius:14px; font-size:12px; display:none;
  box-shadow:0 6px 20px rgba(255,71,87,0.4);
}
.alert-banner.show { display:block; animation:alertShake 0.5s; }
@keyframes alertShake { 25%{transform:translateX(-52%)} 75%{transform:translateX(-48%)} }
.offline-banner {
  position:absolute; top:112px; left:50%; transform:translateX(-50%); z-index:10000;
  background:var(--orange); color:#1a1204; padding:4px 14px; border-radius:10px; font-size:10px; display:none; font-weight:bold;
}
.offline-banner.show { display:block; }

.layers-panel {
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%); z-index:1000;
  background:var(--glass); border:1px solid var(--brass); border-radius:16px; padding:8px 10px;
  display:flex; gap:7px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
  max-width:78vw;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
  scrollbar-width:none;
}
.layers-panel::-webkit-scrollbar { display:none; }
.layer-btn {
  background:linear-gradient(145deg, var(--navy-800), var(--navy-900));
  border:1px solid var(--brass-dim); color:var(--ink-dim); padding:7px 12px; border-radius:11px; cursor:pointer;
  font-family:inherit; font-size:9px; font-weight:bold; display:flex; align-items:center; gap:5px;
  transition: all .15s ease; flex-shrink:0; white-space:nowrap;
}
.layer-btn svg { width:13px; height:13px; }
.layer-btn.active { background:linear-gradient(145deg, var(--brass-light), var(--brass)); color:var(--navy-950); border-color:var(--brass-light); }

body.theme-red { --teal:#ff5555; --brass:#ff8844; --brass-light:#ffb877; }

@media(max-width:600px) {
  .brand-text h1 { font-size:12px; letter-spacing:1.5px; }
  .icon-btn { width:32px; height:32px; }
  .icon-btn svg { width:15px; height:15px; }
  .layer-btn { font-size:8px; padding:6px 9px; }
  .side-btn { width:30px; height:30px; }
  #compassWidget { width:54px; height:54px; top:66px; }
  #compassRose { width:46px; height:46px; }
  #matrixClock { left:70px; top:66px; font-size:10px; }
}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="#f0d878" stroke-width="1.4">
      <circle cx="12" cy="6" r="2.2"/>
      <line x1="12" y1="8.2" x2="12" y2="21"/>
      <path d="M4.5 13a7.5 7.5 0 0 0 15 0"/>
      <line x1="4.5" y1="13" x2="2" y2="13"/>
      <line x1="19.5" y1="13" x2="22" y2="13"/>
    </svg>
    <div class="brand-text">
      <h1>BRÚSSOLA</h1>
      <p>Navegação &amp; Instrumentos</p>
    </div>
  </div>
  <div class="header-btns">
    <button class="icon-btn" data-icon="theme" onclick="toggleTheme()" title="Tema"></button>
    <button class="icon-btn" data-icon="expand" onclick="toggleFullscreen()" title="Tela cheia"></button>
    <button class="icon-btn" data-icon="gauge" onclick="toggleInstruments()" title="Instrumentos"></button>
    <button class="icon-btn" data-icon="layers" onclick="toggleMapBase()" title="Base do mapa"></button>
    <button class="icon-btn" data-icon="ruler" onclick="toggleRuler()" title="Régua"></button>
    <button class="icon-btn danger" data-icon="lifebuoy" onclick="triggerMOB()" title="Homem ao mar"></button>
    <button class="icon-btn danger" data-icon="sos" onclick="triggerSOS()" title="SOS"></button>
    <button class="icon-btn danger" data-icon="close" onclick="window.location.href='/index.html'" title="Fechar"></button>
  </div>
</div>

<div id="compassWidget">
  <svg id="compassRose" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#c9a227" stroke-width="1"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#c9a227" stroke-width="0.5" opacity="0.5"/>
    <g stroke="#7f95a8" stroke-width="0.6">
      <line x1="50" y1="6" x2="50" y2="12"/>
      <line x1="50" y1="88" x2="50" y2="94"/>
      <line x1="6" y1="50" x2="12" y2="50"/>
      <line x1="88" y1="50" x2="94" y2="50"/>
    </g>
    <polygon points="50,10 45,50 50,52 55,50" fill="#ff4757"/>
    <polygon points="50,90 45,50 50,48 55,50" fill="#e9f1f4"/>
    <text x="50" y="20" text-anchor="middle" fill="#f0d878" font-size="9" font-family="Cinzel, serif">N</text>
    <text x="50" y="85" text-anchor="middle" fill="#7f95a8" font-size="7" font-family="Cinzel, serif">S</text>
    <text x="16" y="53" text-anchor="middle" fill="#7f95a8" font-size="7" font-family="Cinzel, serif">O</text>
    <text x="84" y="53" text-anchor="middle" fill="#7f95a8" font-size="7" font-family="Cinzel, serif">L</text>
    <circle cx="50" cy="50" r="2.5" fill="#c9a227"/>
  </svg>
  <div class="hdg-readout" id="hdgReadout">--°</div>
</div>

<div id="matrixClock">00:00:00</div>
<div class="status-bar"><span id="locationStatus">GPS…</span></div>
<div class="alert-banner" id="alertBanner">ALERTA</div>
<div class="offline-banner" id="offlineBanner">OFFLINE</div>

<div class="instrument-panel" id="instrumentPanel">
  <div class="inst-title">INSTRUMENTOS</div>
  <div class="inst-row">SOG: <span class="inst-val" id="instSOG">-- kn</span></div>
  <div class="inst-row">COG: <span class="inst-val" id="instCOG">--°</span></div>
  <div class="inst-row">HDG: <span class="inst-val" id="instHDG">--°</span></div>
  <div class="inst-row">Prof: <span class="inst-val" id="instDepth">-- m</span></div>
  <div class="inst-row">VMG: <span class="inst-val" id="instVMG">-- kn</span></div>
  <div class="inst-row">Vento: <span class="inst-val" id="instWind">-- kn</span></div>
  <div class="inst-row">Pressão: <span class="inst-val" id="instPressure">-- hPa</span></div>
</div>

<div class="side-menu" id="sideMenu">
  <button class="side-btn" data-icon="waypoint" onclick="toggleMode('waypoint')" title="Waypoint"></button>
  <button class="side-btn" data-icon="route" onclick="toggleMode('route')" title="Rota"></button>
  <button class="side-btn" data-icon="anchor" onclick="toggleAnchor()" title="Âncora"></button>
  <button class="side-btn" data-icon="track" onclick="toggleMode('track')" title="Trajeto"></button>
  <button class="side-btn" data-icon="ship" onclick="toggleAIS()" title="AIS"></button>
  <button class="side-btn" data-icon="tide" onclick="showModal('tide')" title="Marés"></button>
  <button class="side-btn" data-icon="logbook" onclick="showModal('logbook')" title="Diário"></button>
  <button class="side-btn" data-icon="flag" onclick="showModal('regata')" title="Regata"></button>
  <button class="side-btn" data-icon="checklist" onclick="showModal('checklist')" title="Checklist"></button>
  <button class="side-btn" data-icon="port" onclick="showModal('ports')" title="Portos"></button>
  <button class="side-btn" data-icon="folder" onclick="showModal('gpx')" title="GPX"></button>
  <button class="side-btn" data-icon="boat" onclick="showModal('vessel')" title="Embarcação"></button>
  <button class="side-btn" data-icon="weather" onclick="showModal('weather')" title="Previsão"></button>
</div>

<div id="weatherMap"></div>
<div class="crosshair"></div>
<div id="coordsBar">LAT: --.---- | LNG: --.----</div>

<div class="layers-panel" id="layersPanel">
  <button class="layer-btn" data-layer="labels" data-icon="tag" onclick="handleLayerClick('labels', this)">Rótulos</button>
  <button class="layer-btn" data-layer="sea" data-icon="anchor" onclick="handleLayerClick('sea', this)">Náutica</button>
  <button class="layer-btn" data-layer="clouds" data-icon="cloud" onclick="handleLayerClick('clouds', this)">Nuvens</button>
  <button class="layer-btn" data-layer="rain" data-icon="rain" onclick="handleLayerClick('rain', this)">Chuva</button>
  <button class="layer-btn" data-layer="heat" data-icon="temp" onclick="handleLayerClick('heat', this)">Calor</button>
  <button class="layer-btn" data-layer="wind" data-icon="wind" onclick="handleLayerClick('wind', this)">Vento</button>
  <button class="layer-btn" data-layer="pressure" data-icon="pressure" onclick="handleLayerClick('pressure', this)">Pressão</button>
</div>

<div class="modal-overlay" id="modalOverlay"></div>

<script>
const ICONS = {
  theme:   '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none" opacity="0.35"/>',
  expand:  '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>',
  gauge:   '<circle cx="12" cy="13" r="8"/><line x1="12" y1="13" x2="16" y2="9"/><line x1="8" y1="5" x2="9" y2="6.5"/><line x1="16" y1="5" x2="15" y2="6.5"/>',
  layers:  '<polygon points="12,3 21,8 12,13 3,8"/><polyline points="3,12 12,17 21,12"/><polyline points="3,16 12,21 21,16"/>',
  ruler:   '<rect x="2" y="9" width="20" height="6" rx="1"/><line x1="6" y1="9" x2="6" y2="12"/><line x1="10" y1="9" x2="10" y2="12"/><line x1="14" y1="9" x2="14" y2="12"/><line x1="18" y1="9" x2="18" y2="12"/>',
  lifebuoy:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.8"/><line x1="6" y1="6" x2="9" y2="9"/><line x1="18" y1="6" x2="15" y2="9"/><line x1="6" y1="18" x2="9" y2="15"/><line x1="18" y1="18" x2="15" y2="15"/>',
  sos:     '<polygon points="12,2 22,20 2,20"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/>',
  close:   '<line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>',
  waypoint:'<path d="M12 2C7.6 2 4 5.5 4 10c0 6 8 12 8 12s8-6 8-12c0-4.5-3.6-8-8-8z"/><circle cx="12" cy="10" r="2.6"/>',
  route:   '<polyline points="4,20 4,12 12,12 12,4 20,4"/><circle cx="4" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="20" cy="4" r="1.4" fill="currentColor" stroke="none"/>',
  anchor:  '<circle cx="12" cy="5" r="2"/><line x1="12" y1="7" x2="12" y2="21"/><path d="M5 12a7 7 0 0 0 14 0"/><line x1="5" y1="12" x2="3" y2="12"/><line x1="19" y1="12" x2="21" y2="12"/>',

    OPENWEATHER_API_KEY: 'SUA_API_KEY_AQUI',

    MARINETRAFFIC_API_KEY: '',
    WORLD_TIDES_API_KEY: '',

    DEFAULT_LNG: -46.63,
    DEFAULT_ZOOM: 12,

class NauticalMap {
    constructor() {
        this.map = L.map('weatherMap', { zoomControl: false, attributionControl: true })
            .setView([CONFIG.DEFAULT_LAT, CONFIG.DEFAULT_LNG], CONFIG.DEFAULT_ZOOM);
        this.layers = {};
        this.rulerPoints = [];
        this.rulerMode = false;
        this.initBaseLayer();
        this.initOverlayLayers();
        this.initControls();
    }

    initBaseLayer() {
        this.layers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
        this.layers.dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 });
        this.layers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
        this.bases = ['satellite', 'dark', 'osm'];
        this.baseLayerIndex = 0;
        this.layers.satellite.addTo(this.map);
    }

    initOverlayLayers() {
        const api = CONFIG.OPENWEATHER_API_KEY;
        this.layers.labels = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', { maxZoom: 19, opacity: 0.95, subdomains: 'abcd' });
        this.layers.sea = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18, opacity: 0.7 });
        this.layers.clouds = L.tileLayer(`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${api}`, { maxZoom: 10, opacity: 0.5 });
        this.layers.rain = L.tileLayer('https://tilecache.rainviewer.com/v2/radar/nowcast/past/{z}/{x}/{y}/2/1_1.png', { maxZoom: 10, opacity: 0.5 });
        this.layers.heat = L.tileLayer(`https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=${api}`, { maxZoom: 10, opacity: 0.5 });
        this.layers.wind = L.tileLayer(`https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=${api}`, { maxZoom: 10, opacity: 0.5 });
        this.layers.pressure = L.tileLayer(`https://tile.openweathermap.org/map/pressure_new/{z}/{x}/{y}.png?appid=${api}`, { maxZoom: 10, opacity: 0.5 });
    }

    initControls() {
        L.control.zoom({ position: 'bottomright' }).addTo(this.map);
        L.control.scale({ position: 'bottomleft', imperial: false }).addTo(this.map);
    }

    isLayerActive(name) {
        return this.layers[name] ? this.map.hasLayer(this.layers[name]) : false;
    }

    toggleLayer(name) {
        const layer = this.layers[name];
        if(!layer) return false;
        if(this.map.hasLayer(layer)) { this.map.removeLayer(layer); return false; }
        else { this.map.addLayer(layer); return true; }
    }

    toggleBase() {
        const current = this.bases[this.baseLayerIndex];
        this.map.removeLayer(this.layers[current]);
        this.baseLayerIndex = (this.baseLayerIndex + 1) % this.bases.length;
        this.map.addLayer(this.layers[this.bases[this.baseLayerIndex]]);
        showAlert('Base: ' + this.bases[this.baseLayerIndex].toUpperCase());
    }

    toggleRulerMode() {
        this.rulerMode = !this.rulerMode;
        if(!this.rulerMode) {
            this.rulerPoints.forEach(p => this.map.removeLayer(p));
            this.rulerPoints = [];
        }
    }
}

class GPSManager {
    constructor(mapInstance) {
        this.mapInstance = mapInstance;
        this.lat = null;
        this.lng = null;
        this.speed = 0;
        this.heading = 0;
        this.marker = null;
        this.circle = null;
        this.watchId = null;
    }

    start() {
        if(navigator.geolocation) {
            this.watchId = navigator.geolocation.watchPosition(
                (pos) => this.update(pos),
                (err) => this.onError(err),
                { enableHighAccuracy: true, maximumAge: CONFIG.GPS_MAXAGE, timeout: CONFIG.GPS_TIMEOUT }
            );
        }
    }

    update(pos) {
        this.lat = pos.coords.latitude;
        this.lng = pos.coords.longitude;
        this.speed = pos.coords.speed || 0;
        this.heading = pos.coords.heading || 0;

        document.getElementById('coordsBar').textContent = `LAT: ${this.lat.toFixed(4)} | LNG: ${this.lng.toFixed(4)}`;
        document.getElementById('locationStatus').textContent = 'GPS OK';

        const sog = (this.speed * 1.94384).toFixed(1);
        const cog = Math.round(this.heading);
        document.getElementById('instSOG').textContent = sog + ' kn';
        document.getElementById('instCOG').textContent = cog + '°';
        document.getElementById('instHDG').textContent = cog + '°';

        const rose = document.getElementById('compassRose');
        if(rose) rose.style.transform = `rotate(${-cog}deg)`;
        const hdgReadout = document.getElementById('hdgReadout');
        if(hdgReadout) hdgReadout.textContent = cog + '°';

        if(!this.marker) {
            this.marker = L.marker([this.lat, this.lng], {
                icon: L.divIcon({ className: '', html: '<svg width="28" height="28" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 8px #2dd4bf)"><path d="M12 1L22 22L12 18L2 22L12 1Z" fill="#04121d" stroke="#2dd4bf" stroke-width="2"/><circle cx="12" cy="10" r="2" fill="#2dd4bf"/></svg>', iconSize: [12,12] })
            }).addTo(this.mapInstance.map);
            this.circle = L.circle([this.lat, this.lng], { radius: 300, color: '#c9a227', fillOpacity: 0.03, weight: 1 }).bindTooltip("GPS: precisão 300m — NÃO é batimetria", {permanent: false}).addTo(this.mapInstance.map);
            this.mapInstance.map.setView([this.lat, this.lng], 14);
        } else {
            this.marker.setLatLng([this.lat, this.lng]);
            this.circle.setLatLng([this.lat, this.lng]);
        }
    }

    onError(err) {
        document.getElementById('locationStatus').textContent = 'GPS NEGADO';
    }
}

class AnchorAlarm {
    constructor(mapInstance) {
        this.mapInstance = mapInstance;
        this.anchorPos = null;
        this.circle = null;
        this.active = false;
    }

    toggle() {
        const gps = window.gpsManager;
        if(!gps.lat || !gps.lng) { showAlert('GPS ainda não adquirido'); return; }

        this.active = !this.active;
        document.querySelector('[data-icon="anchor"]').classList.toggle('active', this.active);
        if(this.active) {
            this.anchorPos = { lat: gps.lat, lng: gps.lng };
            this.circle = L.circle([this.anchorPos.lat, this.anchorPos.lng], {
                radius: CONFIG.ANCHOR_RADIUS,
                color: '#ff4757',
                fillColor: '#ff4757',
                fillOpacity: 0.035,
                weight: 2,
                dashArray: '8 4'
            }).addTo(this.mapInstance.map);
            showAlert('ALARME DE ÂNCORA ATIVADO');
        } else {
            if(this.circle) this.mapInstance.map.removeLayer(this.circle);
            this.anchorPos = null;
            showAlert('Alarme desativado');
        }
    }

    checkDrift() {
        if(!this.active || !this.anchorPos) return;
        const gps = window.gpsManager;
        if(!gps.lat) return;
        const dist = this.distance(this.anchorPos.lat, this.anchorPos.lng, gps.lat, gps.lng);
        if(dist > CONFIG.ANCHOR_RADIUS) {
            showAlert('DERIVA DETECTADA! Barco saiu do raio de segurança!');
            if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
    }

    distance(lat1, lng1, lat2, lng2) {
        const R = 6371000;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLng = (lng2-lng1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
}

class AISManager {
    constructor(mapInstance) {
        this.mapInstance = mapInstance;
        this.ships = [];
        this.markers = [];
        this.active = false;
    }

    toggle() {
        this.active = !this.active;
        document.querySelector('[data-icon="ship"]').classList.toggle('active', this.active);
        if(this.active) {
            this.generateMockShips();
            this.renderShips();
            showAlert('AIS ATIVADO — ' + this.ships.length + ' navios');
        } else {
            this.markers.forEach(m => this.mapInstance.map.removeLayer(m));
            this.markers = [];
            showAlert('AIS desativado');
        }
    }

    generateMockShips() {
        const gps = window.gpsManager;
        if(!gps.lat) return;
        this.ships = [];
        const types = ['Cargo', 'Tanker', 'Fishing', 'Passenger', 'Pleasure'];
        for(let i = 0; i < 8; i++) {
            this.ships.push({
                id: i,
                name: 'NAVIO-' + (1000 + i),
                type: types[i % types.length],
                lat: gps.lat + (Math.random()-0.5) * 0.5,
                lng: gps.lng + (Math.random()-0.5) * 0.5,
                speed: Math.random() * 20,
                heading: Math.random() * 360,
                cpa: Math.random() * 3,
                tcpa: Math.random() * 30
            });
        }
    }

    renderShips() {
        this.ships.forEach(ship => {
            const marker = L.marker([ship.lat, ship.lng], {
                icon: L.divIcon({ className: '', html: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffa94d" stroke-width="1.8" style="filter:drop-shadow(0 0 5px #ffa94d)"><path d="M3 15h18l-2.2 5H5.2z"/><line x1="12" y1="3" x2="12" y2="15"/><path d="M7.5 15l1-8h7l1 8"/></svg>', iconSize: [18,18] })
            }).addTo(this.mapInstance.map);
            marker.bindPopup(`<b>${ship.name}</b><br>Tipo: ${ship.type}<br>Vel: ${ship.speed.toFixed(1)} kn<br>CPA: ${ship.cpa.toFixed(2)} NM<br>TCPA: ${ship.tcpa.toFixed(0)} min`);
            this.markers.push(marker);
        });
    }
}

let currentMode = null;

    currentMode = currentMode === mode ? null : mode;

}

function svgIcon(name, color) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px;">${ICONS[name]}</svg>`;
}

function showModal(type) {
    const overlay = document.getElementById('modalOverlay');
    overlay.innerHTML = '';
    const modal = document.createElement('div');
    modal.className = 'modal';
    const closeBtn = `<button class="modal-close" onclick="hideModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>`;

    const modals = {
        tide: `<div class="modal-title">${svgIcon('tide','#f0d878')}MARÉS ${closeBtn}</div><label>Latitude</label><input id="tideLat" type="number" value="-23.55" step="0.001"><label>Longitude</label><input id="tideLng" type="number" value="-46.63" step="0.001"><button class="btn-primary" onclick="calcTide()">Calcular</button><div id="tideResult" style="margin-top:8px;"></div>`,
        logbook: `<div class="modal-title">${svgIcon('logbook','#f0d878')}DIÁRIO ${closeBtn}</div><textarea id="logNote" rows="3" placeholder="Nota..."></textarea><button class="btn-primary" onclick="addLog()">Adicionar</button><div id="logList" style="margin-top:8px;max-height:150px;overflow-y:auto;"></div>`,
        regata: `<div class="modal-title">${svgIcon('flag','#f0d878')}REGATA ${closeBtn}</div><div style="font-size:26px;text-align:center;color:#f0d878;margin:12px 0;letter-spacing:2px;" id="regTimer">00:00:00</div><div style="display:flex;gap:8px;justify-content:center;"><button class="btn-primary" onclick="startReg()">Iniciar</button><button class="btn-primary" onclick="stopReg()" style="background:linear-gradient(145deg,#8a99a8,#5c6a78);">Parar</button></div>`,
        checklist: `<div class="modal-title">${svgIcon('checklist','#f0d878')}CHECKLIST ${closeBtn}</div><div id="checkContainer"></div>`,
        ports: `<div class="modal-title">${svgIcon('port','#f0d878')}PORTOS ${closeBtn}</div><p style="font-size:10px;color:var(--ink-dim);">20 portos brasileiros (simulação)</p>`,
        gpx: `<div class="modal-title">${svgIcon('folder','#f0d878')}GPX ${closeBtn}</div><div style="display:flex;gap:8px;"><button class="btn-primary">Exportar</button><button class="btn-primary">Importar</button></div>`,
        vessel: `<div class="modal-title">${svgIcon('boat','#f0d878')}EMBARCAÇÃO ${closeBtn}</div><label>Nome</label><input placeholder="Barco"><label>Calado (m)</label><input type="number" value="1.5"><button class="btn-primary">Salvar</button>`,
        weather: `<div class="modal-title">${svgIcon('weather','#f0d878')}PREVISÃO 7 DIAS ${closeBtn}</div><p style="font-size:10px;color:var(--ink-dim);">Integre a OpenWeather One Call API</p>`
    };

    modal.innerHTML = modals[type] || `<p>Em desenvolvimento</p>`;
    overlay.appendChild(modal);
    overlay.classList.add('visible');

    if(type === 'checklist') initChecklist();
    if(type === 'logbook') loadLog();
}

function hideModal() {
    document.getElementById('modalOverlay').classList.remove('visible');
    document.getElementById('modalOverlay').innerHTML = '';
}

function calcTide() {
    const now = new Date();
    const h = now.getHours() + now.getMinutes()/60;
    const height = 1.5 * Math.sin((h-6)*Math.PI/6) + 1.5;
    document.getElementById('tideResult').innerHTML = `<div style="font-size:11px;">Altura: <b style="color:#2dd4bf;">${height.toFixed(2)}m</b><br>Estado: ${height>1.8?'MARÉ ALTA':height>0.8?'SUBINDO':'MARÉ BAIXA'}</div>`;
}

function addLog() {
    const note = document.getElementById('logNote').value.trim();
    if(!note) return;
    const logs = JSON.parse(localStorage.getItem('naut_log') || '[]');
    const gps = window.gpsManager;
    logs.unshift({ note, time: new Date().toLocaleString(), lat: gps.lat, lng: gps.lng });
    localStorage.setItem('naut_log', JSON.stringify(logs));
    document.getElementById('logNote').value = '';
    loadLog();
}

function loadLog() {
    const logs = JSON.parse(localStorage.getItem('naut_log') || '[]');
    document.getElementById('logList').innerHTML = logs.map(l => `<div style="font-size:10px;padding:6px 2px;border-bottom:1px solid var(--brass-dim);"><b style="color:#f0d878;">${l.time}</b><br>${l.note}</div>`).join('') || '<p style="color:var(--ink-dim);">Sem entradas</p>';
}

function initChecklist() {
    const items = ['Documentos','Combustível','Colete','Âncora','Rádio VHF','Lanterna','Água','Primeiros socorros'];
    document.getElementById('checkContainer').innerHTML = items.map(i => `<div style="font-size:11px;padding:6px 4px;cursor:pointer;" onclick="this.classList.toggle('checked'); this.style.color=this.classList.contains('checked')?'#2dd4bf':'#e9f1f4'; this.style.textDecoration=this.classList.contains('checked')?'line-through':'none';">☐ ${i}</div>`).join('');
}

let regInterval = null, regSeconds = 0;
function startReg() {
    clearInterval(regInterval);
    regInterval = setInterval(() => {
        regSeconds++;
        const h = String(Math.floor(regSeconds/3600)).padStart(2,'0');
        const m = String(Math.floor((regSeconds%3600)/60)).padStart(2,'0');
        const s = String(regSeconds%60).padStart(2,'0');
        document.getElementById('regTimer').textContent = `${h}:${m}:${s}`;
    }, 1000);
}
function stopReg() { clearInterval(regInterval); }
</script>
