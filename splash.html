<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATRIX OS - Inicialização</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505; overflow: hidden; height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Courier New', monospace;
            perspective: 800px;
        }

        /* 🔥 TELA DE CARREGAMENTO (CONTAINER) */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #050505 0%, #000000 100%);
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }
        #splashScreen.hidden {
            opacity: 0;
            transform: scale(1.8); /* Efeito de hiperespaço entrando na tela */
            pointer-events: none;
        }

        /* 🔥 ESTRELAS 3D EM ALTA VELOCIDADE (Efeito Andromeda) */
        #starsCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* 🔥 NAVE MATRIX (Desenhada em CSS para ser leve) */
        .spaceship-container {
            position: relative; z-index: 2;
            width: 120px; height: 60px;
            display: flex; justify-content: center; align-items: center;
            animation: zoomShip 4s ease-in-out infinite alternate;
        }
        .spaceship {
            width: 100%; height: 100%;
            background: #00ff00;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            box-shadow: 0 0 60px #00ff00, 0 0 120px #00ff00, inset 0 0 20px #00ff00;
            animation: pulseShip 1.5s infinite alternate;
        }
        /* Asas da nave */
        .spaceship::before {
            content: ''; position: absolute; top: 40%; left: -30px;
            width: 40px; height: 15px; background: #00ff00;
            clip-path: polygon(100% 0%, 0% 50%, 100% 100%);
            box-shadow: 0 0 30px #00ff00;
            transform: rotate(-10deg);
        }
        .spaceship::after {
            content: ''; position: absolute; top: 40%; right: -30px;
            width: 40px; height: 15px; background: #00ff00;
            clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
            box-shadow: 0 0 30px #00ff00;
            transform: rotate(10deg);
        }

        @keyframes pulseShip {
            0% { transform: scale(0.9); box-shadow: 0 0 60px #00ff00; }
            100% { transform: scale(1.1); box-shadow: 0 0 120px #00ff00; }
        }
        @keyframes zoomShip {
            0% { transform: scale(0.8) translateZ(-100px); }
            100% { transform: scale(1) translateZ(50px); }
        }

        /* 🔥 TEXTO DE CARREGAMENTO ESTILO MATRIX */
        .loading-text {
            position: relative; z-index: 2;
            color: #00ff00; font-size: 12px; margin-top: 20px;
            text-shadow: 0 0 20px rgba(0,255,0,0.5);
            letter-spacing: 4px;
            background: rgba(0,0,0,0.6); padding: 8px 16px; border: 1px solid #00ff00;
            border-radius: 4px;
            animation: blink 1.5s step-start infinite;
        }
        @keyframes blink { 50% { opacity: 0.2; } }

        .tap-to-enter {
            position: relative; z-index: 2;
            color: rgba(0,255,0,0.6); font-size: 10px; margin-top: 20px;
            animation: blink 2s infinite; cursor: pointer;
            border: 1px solid rgba(0,255,0,0.2); padding: 6px 14px; border-radius: 20px;
        }
    </style>
</head>
<body>
    <!-- 🔥 TELA SPLASH ANDROMEDA -->
    <div id="splashScreen">
        <!-- Canvas de Estrelas 3D -->
        <canvas id="starsCanvas"></canvas>

        <!-- Nave Matrix -->
        <div class="spaceship-container">
            <div class="spaceship"></div>
        </div>

        <div class="loading-text">SISTEMA MATRIX INICIANDO...</div>
        <div class="tap-to-enter">[ TOQUE PARA ENTRAR NO HIPERESPAÇO ]</div>
    </div>

    <script>
        // 🔥 MECÂNICA 3D DE ESTRELAS (MASS EFFECT ANDROMEDA)
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function initStars() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 600; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * 1000,
                    y: (Math.random() - 0.5) * 1000,
                    z: (Math.random() - 0.5) * 1000
                });
            }
        }
        initStars();
        window.addEventListener('resize', initStars);

        function animateStars() {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            stars.forEach(star => {
                // 💨 AUMENTO DE VELOCIDADE DO HIPERESPAÇO
                star.z += 8;
                if (star.z > 1000) star.z = -1000;

                const k = 300 / star.z;
                const sx = star.x * k + centerX;
                const sy = star.y * k + centerY;
                const size = Math.abs(k) * 1.5;

                // Efeito de rastro verde
                const green = Math.min(255, Math.abs(star.z) / 4);
                ctx.fillStyle = `rgb(0, ${green}, 0)`;

                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(0.5, size), 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animateStars);
        }
        animateStars();

        // 🔥 TRANSIÇÃO PARA O APP
        function enterMatrix() {
            const splash = document.getElementById('splashScreen');
            splash.classList.add('hidden');

            setTimeout(() => {
                // Verifica se o usuário está logado e se é premium
                const user = JSON.parse(localStorage.getItem('matrixUser'));
                if(user && user.isPremium) {
                    window.location.href = '/nave.html'; // Vai direto para a Nave
                } else {
                    window.location.href = '/index.html'; // Vai para o Chat Free
                }
            }, 1200);
        }

        // Entra automaticamente após 5 segundos OU se o usuário tocar
        document.getElementById('splashScreen').addEventListener('click', enterMatrix);
        setTimeout(enterMatrix, 5000);
    </script>
</body>
</html>
