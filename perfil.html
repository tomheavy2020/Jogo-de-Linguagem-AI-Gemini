<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⬡ MATRIX - Perfil Cyberpunk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#000;
            color:#00ff41;
            font-family:'Rajdhani',sans-serif;
            min-height:100dvh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0,255,65,0.03), transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0,234,255,0.03), transparent 60%),
                #000;
            overflow-y:auto;
        }
        .container{
            max-width:520px;
            width:100%;
            background:rgba(0,10,5,0.88);
            border:2px solid rgba(0,255,65,0.15);
            border-radius:28px;
            padding:30px 24px 40px;
            backdrop-filter:blur(24px);
            box-shadow:0 0 80px rgba(0,255,65,0.04), inset 0 0 80px rgba(0,255,65,0.02);
            position:relative;
            overflow:hidden;
        }
        .container::before{
            content:'';
            position:absolute;
            inset:0;
            background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.008) 3px);
            pointer-events:none;
            z-index:0;
        }
        .container>*{position:relative;z-index:1}
        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            padding-bottom:12px;
            border-bottom:1px solid rgba(0,255,65,0.06);
        }
        .header h1{
            font-family:'Orbitron',sans-serif;
            font-size:16px;
            font-weight:900;
            color:#00ff41;
            text-shadow:0 0 30px rgba(0,255,65,0.3);
            letter-spacing:2px;
        }
        .header h1 span{color:#00f0ff;}
        .header .back{
            color:rgba(0,255,65,0.3);
            text-decoration:none;
            font-family:'Share Tech Mono',monospace;
            font-size:11px;
            padding:6px 14px;
            border:1px solid rgba(0,255,65,0.08);
            border-radius:20px;
            transition:0.3s;
        }
        .header .back:hover{
            border-color:rgba(0,255,65,0.3);
            color:#00ff41;
        }

        /* === AVATAR CYBERPUNK === */
        .profile-avatar{
            display:flex;
            flex-direction:column;
            align-items:center;
            margin-bottom:16px;
            position:relative;
        }
        .avatar-container{
            position:relative;
            width:130px;
            height:130px;
            border-radius:50%;
            padding:4px;
            background:linear-gradient(135deg,#00ff41,#00f0ff,#ffb000);
            animation:avatarGlow 3s ease-in-out infinite;
            box-shadow:0 0 50px rgba(0,255,65,0.15);
        }
        @keyframes avatarGlow{
            0%,100%{box-shadow:0 0 50px rgba(0,255,65,0.15), 0 0 80px rgba(0,234,255,0.05);}
            50%{box-shadow:0 0 80px rgba(0,255,65,0.25), 0 0 120px rgba(0,234,255,0.08);}
        }
        .avatar-container .ring{
            position:absolute;
            inset:-8px;
            border-radius:50%;
            border:1px solid rgba(0,255,65,0.08);
            animation:ringSpin 20s linear infinite;
        }
        .avatar-container .ring.r2{
            inset:-16px;
            border-color:rgba(0,234,255,0.06);
            animation-duration:30s;
            animation-direction:reverse;
        }
        @keyframes ringSpin{to{transform:rotate(360deg)}}
        .avatar-circle{
            width:100%;
            height:100%;
            border-radius:50%;
            background:radial-gradient(circle at 30% 30%, #0a2a12, #000 80%);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:56px;
            cursor:pointer;
            transition:0.3s;
            border:2px solid rgba(0,255,65,0.1);
            overflow:hidden;
            position:relative;
        }
        .avatar-circle .status-dot{
            position:absolute;
            bottom:8px;
            right:12px;
            width:14px;
            height:14px;
            border-radius:50%;
            background:#00ff41;
            box-shadow:0 0 20px rgba(0,255,65,0.5);
            border:2px solid #000;
            animation:pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot{
            0%,100%{opacity:1;transform:scale(1)}
            50%{opacity:0.4;transform:scale(0.8)}
        }
        .profile-name{
            font-size:22px;
            font-weight:700;
            color:#fff;
            margin-top:8px;
            text-shadow:0 0 30px rgba(0,255,65,0.2);
            font-family:'Orbitron',sans-serif;
            letter-spacing:1px;
        }
        .profile-level{
            font-size:12px;
            color:rgba(0,255,65,0.4);
            font-family:'Share Tech Mono',monospace;
            letter-spacing:2px;
        }

        /* === XP BAR CYBERPUNK === */
        .xp-section{margin:12px 0 16px}
        .xp-bar{
            background:rgba(0,255,65,0.04);
            border-radius:16px;
            height:8px;
            overflow:hidden;
            border:1px solid rgba(0,255,65,0.06);
            position:relative;
        }
        .xp-bar-fill{
            height:100%;
            background:linear-gradient(90deg,#00ff41,#00f0ff);
            border-radius:16px;
            width:62%;
            transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow:0 0 30px rgba(0,255,65,0.2);
            position:relative;
        }
        .xp-bar-fill::after{
            content:'';
            position:absolute;
            top:0;left:0;right:0;bottom:0;
            background:linear-gradient(90deg,transparent, rgba(255,255,255,0.2), transparent);
            animation:xpShine 2s ease-in-out infinite;
        }
        @keyframes xpShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
        .xp-info{
            display:flex;
            justify-content:space-between;
            font-size:10px;
            color:rgba(255,255,255,0.3);
            font-family:'Share Tech Mono',monospace;
            margin-top:4px;
            letter-spacing:0.5px;
        }

        /* === STATS GRID === */
        .stats-grid{
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:8px;
            margin:12px 0 16px;
        }
        .stat-card{
            background:rgba(0,255,65,0.02);
            border:1px solid rgba(0,255,65,0.04);
            border-radius:12px;
            padding:12px 8px;
            text-align:center;
            transition:0.3s;
            position:relative;
            overflow:hidden;
        }
        .stat-card::before{
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(135deg,rgba(0,255,65,0.02),transparent);
            opacity:0;
            transition:0.3s;
        }
        .stat-card:hover::before{opacity:1}
        .stat-card .number{
            font-family:'Orbitron',sans-serif;
            font-size:18px;
            font-weight:700;
            color:#00ff41;
            text-shadow:0 0 20px rgba(0,255,65,0.15);
        }
        .stat-card .label{
            font-size:8px;
            color:rgba(255,255,255,0.2);
            font-family:'Share Tech Mono',monospace;
            letter-spacing:1px;
            margin-top:2px;
        }

        /* === MENU CYBERPUNK === */
        .menu-section{margin:16px 0}
        .menu-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:14px 12px;
            border-bottom:1px solid rgba(0,255,65,0.03);
            cursor:pointer;
            transition:0.3s;
            border-radius:8px;
            margin-bottom:2px;
        }
        .menu-item:hover{
            background:rgba(0,255,65,0.03);
            padding-left:16px;
            border-color:rgba(0,255,65,0.08);
        }
        .menu-item .left{display:flex;align-items:center;gap:12px}
        .menu-item .left .icon{font-size:16px;width:28px;text-align:center}
        .menu-item .left .text{color:#fff;font-size:13px;font-weight:500}
        .menu-item .right{
            color:rgba(0,255,65,0.15);
            font-family:'Share Tech Mono',monospace;
            font-size:10px;
            transition:0.3s;
        }
        .menu-item:hover .right{color:rgba(0,255,65,0.4)}

        /* === BADGES === */
        .badge-section{
            margin-top:16px;
            padding-top:16px;
            border-top:1px solid rgba(0,255,65,0.04);
        }
        .badge-section .title{
            font-size:9px;
            color:rgba(0,255,65,0.2);
            font-family:'Orbitron',sans-serif;
            letter-spacing:2px;
            margin-bottom:10px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .badge-section .title::after{
            content:'';
            flex:1;
            height:1px;
            background:linear-gradient(90deg,rgba(0,255,65,0.1),transparent);
        }
        .badges{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .badge-item{
            width:44px;
            height:44px;
            border-radius:50%;
            background:rgba(0,255,65,0.03);
            border:1px solid rgba(0,255,65,0.06);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            transition:0.3s;
            cursor:default;
            position:relative;
        }
        .badge-item.unlocked{
            border-color:rgba(0,255,65,0.15);
            background:rgba(0,255,65,0.04);
            box-shadow:0 0 20px rgba(0,255,65,0.04);
        }
        .badge-item.unlocked:hover{
            transform:scale(1.15);
            box-shadow:0 0 30px rgba(0,255,65,0.1);
            border-color:rgba(0,255,65,0.3);
        }
        .badge-item.locked{
            opacity:0.15;
            filter:grayscale(1);
        }
        .badge-item .badge-tooltip{
            position:absolute;
            bottom:calc(100% + 8px);
            left:50%;
            transform:translateX(-50%) scale(0.8);
            background:rgba(0,10,5,0.95);
            border:1px solid rgba(0,255,65,0.1);
            border-radius:8px;
            padding:4px 10px;
            font-size:8px;
            color:rgba(255,255,255,0.5);
            font-family:'Share Tech Mono',monospace;
            white-space:nowrap;
            opacity:0;
            transition:0.3s;
            pointer-events:none;
        }
        .badge-item:hover .badge-tooltip{
            opacity:1;
            transform:translateX(-50%) scale(1);
        }

        /* === PERSONALIZAÇÃO === */
        .customize-section{
            margin-top:16px;
            padding:16px;
            background:rgba(0,255,65,0.02);
            border:1px solid rgba(0,255,65,0.04);
            border-radius:16px;
            display:none;
        }
        .customize-section.active{
            display:block;
            animation:fadeIn 0.4s ease;
        }
        @keyframes fadeIn{
            from{opacity:0;transform:translateY(10px)}
            to{opacity:1;transform:translateY(0)}
        }
        .customize-section .title{
            font-size:10px;
            color:rgba(0,255,65,0.3);
            font-family:'Orbitron',sans-serif;
            letter-spacing:1px;
            margin-bottom:12px;
        }
        .avatar-options{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .avatar-option{
            width:52px;
            height:52px;
            border-radius:50%;
            background:rgba(0,255,65,0.03);
            border:2px solid rgba(0,255,65,0.06);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            cursor:pointer;
            transition:0.3s;
        }
        .avatar-option:hover{
            border-color:rgba(0,255,65,0.2);
            transform:scale(1.1);
        }
        .avatar-option.active{
            border-color:#00ff41;
            box-shadow:0 0 30px rgba(0,255,65,0.15);
        }
        .theme-options{
            display:flex;
            gap:8px;
            margin-top:10px;
            flex-wrap:wrap;
        }
        .theme-option{
            padding:6px 14px;
            border:1px solid rgba(0,255,65,0.06);
            border-radius:20px;
            font-size:10px;
            color:rgba(255,255,255,0.3);
            font-family:'Share Tech Mono',monospace;
            cursor:pointer;
            transition:0.3s;
        }
        .theme-option:hover{
            border-color:rgba(0,255,65,0.2);
            color:#fff;
        }
        .theme-option.active{
            border-color:#00ff41;
            color:#00ff41;
            background:rgba(0,255,65,0.04);
        }

        @media(max-width:400px){
            .container{padding:20px 16px}
            .stats-grid{grid-template-columns:1fr 1fr}
            .avatar-container{width:100px;height:100px}
            .avatar-circle{font-size:42px}
            .profile-name{font-size:18px}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⬡ <span>MATRIX</span> PERFIL</h1>
        <a href="/index.html" class="back">✕ SAIR</a>
    </div>

    <!-- AVATAR -->
    <div class="profile-avatar">
        <div class="avatar-container">
            <div class="ring"></div>
            <div class="ring r2"></div>
            <div class="avatar-circle" id="avatarCircle">
                🧑‍💻
                <span class="status-dot"></span>
            </div>
        </div>
        <div class="profile-name" id="userName">Operador</div>
        <div class="profile-level" id="userLevel">NÍVEL 1 · RECRUTA</div>
    </div>

    <!-- XP -->
    <div class="xp-section">
        <div class="xp-bar"><div class="xp-bar-fill" id="xpBar" style="width:0%"></div></div>
        <div class="xp-info"><span id="xpText">0 XP</span><span id="nextLevelText">PRÓXIMO: 100 XP</span></div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card"><div class="number" id="modulesCount">0</div><div class="label">MÓDULOS</div></div>
        <div class="stat-card"><div class="number" id="badgesCount">0</div><div class="label">BADGES</div></div>
        <div class="stat-card"><div class="number" id="rankPosition">#0</div><div class="label">RANKING</div></div>
    </div>

    <!-- MENU -->
    <div class="menu-section">
        <div class="menu-item" onclick="toggleCustomize()">
            <div class="left"><span class="icon">🎨</span><span class="text">Personalizar Avatar</span></div>
            <span class="right">▼</span>
        </div>
        <div class="menu-item"><div class="left"><span class="icon">⚙️</span><span class="text">Configurações</span></div><span class="right">→</span></div>
        <div class="menu-item"><div class="left"><span class="icon">🏆</span><span class="text">Conquistas</span></div><span class="right">→</span></div>
        <div class="menu-item"><div class="left"><span class="icon">👥</span><span class="text">Comunidade</span></div><span class="right">→</span></div>
    </div>

    <!-- PERSONALIZAÇÃO -->
    <div class="customize-section" id="customizeSection">
        <div class="title">⬡ SELECIONE SEU AVATAR</div>
        <div class="avatar-options" id="avatarOptions">
            <div class="avatar-option active" data-avatar="🧑‍💻">🧑‍💻</div>
            <div class="avatar-option" data-avatar="👨‍🚀">👨‍🚀</div>
            <div class="avatar-option" data-avatar="🦾">🦾</div>
            <div class="avatar-option" data-avatar="🤖">🤖</div>
            <div class="avatar-option" data-avatar="👾">👾</div>
            <div class="avatar-option" data-avatar="🧙">🧙</div>
            <div class="avatar-option" data-avatar="⚡">⚡</div>
            <div class="avatar-option" data-avatar="🔮">🔮</div>
        </div>
        <div class="title" style="margin-top:12px;">⬡ TEMAS CYBERPUNK</div>
        <div class="theme-options" id="themeOptions">
            <div class="theme-option active" data-theme="neon">🌿 NEON</div>
            <div class="theme-option" data-theme="cyan">💠 CYAN</div>
            <div class="theme-option" data-theme="gold">🔥 GOLD</div>
            <div class="theme-option" data-theme="purple">🔮 PURPLE</div>
        </div>
    </div>

    <!-- BADGES -->
    <div class="badge-section">
        <div class="title">⬡ BADGES DESBLOQUEADAS</div>
        <div class="badges" id="badgesContainer">
            <span class="badge-item locked">❓</span>
            <span class="badge-item locked">❓</span>
            <span class="badge-item locked">❓</span>
            <span class="badge-item locked">❓</span>
        </div>
    </div>
</div>

<script src="/xp-system.js"></script>
<script>
// ===== TOGGLE CUSTOMIZE =====
function toggleCustomize() {
    const section = document.getElementById('customizeSection');
    section.classList.toggle('active');
}

// ===== AVATAR SELECTION =====
document.querySelectorAll('.avatar-option').forEach(opt => {
    opt.addEventListener('click', function() {
        document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('active'));
        this.classList.add('active');
        const avatar = this.dataset.avatar;
        document.getElementById('avatarCircle').innerHTML = avatar + '<span class="status-dot"></span>';
        localStorage.setItem('matrix_avatar', avatar);
    });
});

// ===== THEME SELECTION =====
document.querySelectorAll('.theme-option').forEach(opt => {
    opt.addEventListener('click', function() {
        document.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
        this.classList.add('active');
        const theme = this.dataset.theme;
        document.querySelector('.container').dataset.theme = theme;
        localStorage.setItem('matrix_theme', theme);
        applyTheme(theme);
    });
});

function applyTheme(theme) {
    const container = document.querySelector('.container');
    const colors = {
        neon: { primary: '#00ff41', secondary: '#00f0ff', glow: 'rgba(0,255,65,0.15)' },
        cyan: { primary: '#00f0ff', secondary: '#0088ff', glow: 'rgba(0,240,255,0.15)' },
        gold: { primary: '#ffb000', secondary: '#ff6b00', glow: 'rgba(255,176,0,0.15)' },
        purple: { primary: '#b000ff', secondary: '#ff00ff', glow: 'rgba(176,0,255,0.15)' }
    };
    const c = colors[theme] || colors.neon;
    container.style.borderColor = c.primary;
    container.style.boxShadow = `0 0 80px ${c.glow}, inset 0 0 80px rgba(0,0,0,0.02)`;
    document.querySelectorAll('.number').forEach(el => el.style.color = c.primary);
}

// ===== RESTORE SAVED AVATAR & THEME =====
const savedAvatar = localStorage.getItem('matrix_avatar');
if (savedAvatar) {
    document.getElementById('avatarCircle').innerHTML = savedAvatar + '<span class="status-dot"></span>';
    document.querySelectorAll('.avatar-option').forEach(o => {
        o.classList.toggle('active', o.dataset.avatar === savedAvatar);
    });
}

const savedTheme = localStorage.getItem('matrix_theme');
if (savedTheme) {
    document.querySelectorAll('.theme-option').forEach(o => {
        o.classList.toggle('active', o.dataset.theme === savedTheme);
    });
    applyTheme(savedTheme);
}
</script>
</body>
</html>
