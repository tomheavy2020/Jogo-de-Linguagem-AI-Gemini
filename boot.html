<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⬡ MATRIX OS — FASTBOOT</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#000;
            height:100dvh;
            width:100dvw;
            overflow:hidden;
            position:fixed;
        }
        video{
            position:absolute;
            top:0;left:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:1;
        }
        .overlay{
            position:absolute;
            top:0;left:0;
            width:100%;
            height:100%;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:20px;
            z-index:2;
            background:rgba(0,0,0,0.3);
            cursor:pointer;
        }
        .boot-title{
            font-family:'Orbitron',sans-serif;
            font-size:32px;
            font-weight:900;
            letter-spacing:5px;
            color:#00ff41;
            text-shadow:0 0 30px rgba(0,255,65,0.8);
        }
        .boot-sub{
            font-family:'Share Tech Mono',monospace;
            font-size:14px;
            color:rgba(0,255,65,0.7);
            letter-spacing:3px;
        }
        .enter-btn{
            margin-top:20px;
            padding:18px 50px;
            background:rgba(0,0,0,0.8);
            border:2px solid #00ff41;
            color:#00ff41;
            font-family:'Orbitron',sans-serif;
            font-size:18px;
            letter-spacing:3px;
            border-radius:15px;
            cursor:pointer;
            text-decoration:none;
            box-shadow:0 0 30px rgba(0,255,65,0.3);
        }
        .enter-btn:active{
            background:rgba(0,255,65,0.2);
            transform:scale(0.95);
        }
    </style>
</head>
<body>
    <video autoplay muted playsinline loop>
        <source src="/videos/boot-animation.mp4" type="video/mp4">
    </video>

    <div class="overlay" onclick="window.location.href='/index.html'">
        <div class="boot-title">MATRIX OS</div>
        <div class="boot-sub">WEB 3.0 BOOT - FASTBOOT</div>
        <a href="/index.html" class="enter-btn">⬡ ENTRAR</a>
    </div>

    <script>
        const video = document.querySelector('video');

        function tryPlay() {
            video.play().then(() => {
                console.log('Vídeo tocando!');
            }).catch(() => {
                console.log('Aguardando interação...');
            });
        }

        tryPlay();
        document.addEventListener('touchstart', tryPlay, { once: true });
        document.addEventListener('click', tryPlay, { once: true });
    </script>
<script src="/fullscreen-helper.js"></script>
</body>
</html>
